<style>
:root{
  --bg:#F3F7FC; --card:#FFFFFF; --line:#E4EAF2; --tint:#EFF5FF; --tint2:#E3EDFC;
  --ink:#1E2A3A; --mut:#64748B;
  --blue:#2563EB; --blue-dark:#1D4ED8; --blue-soft:#DBEAFE;
  --good:#16A34A; --good-bg:#DCFCE7;
  --warn:#D97706; --warn-bg:#FEF3C7;
  --crit:#EF4444; --crit-bg:#FEE2E2;
  --shadow:0 1px 2px rgba(30,42,58,.05), 0 6px 18px rgba(30,42,58,.07);
  --shadow-lg:0 2px 6px rgba(30,42,58,.08), 0 16px 38px rgba(37,99,235,.16);
  --cardgrad:linear-gradient(180deg,#FFFFFF 0%,#FBFCFF 100%);
  --hair:1px solid rgba(210,220,236,.85);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai","Noto Sans Lao",Tahoma,sans-serif;font-size:14.5px;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.layout{display:flex;min-height:100vh;align-items:stretch}

/* ---------- sidebar (dark navy) ---------- */
.side{flex:0 0 208px;width:208px;background:linear-gradient(180deg,#0D2246 0%,#0A1830 60%,#081326 100%);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.05), 3px 0 16px rgba(8,19,38,.22)}
.logo{display:flex;align-items:center;gap:10px;padding:20px 16px 12px}
.logo img{width:44px;height:44px;object-fit:contain;flex:0 0 44px;border-radius:13px}
.lname{font-weight:800;font-size:15px;color:#FFFFFF;line-height:1.15;letter-spacing:.3px}
.lname span{display:block;font-size:10px;letter-spacing:.5px;color:#7FB2E8;font-weight:700}
.headctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.langdd{position:relative}
.lddbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:6px 11px;font-size:12px;font-weight:800;color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow);transition:all .15s;user-select:none}
.lddbtn:hover{border-color:var(--blue);color:var(--blue)}
.lddbtn svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.lddbtn .dd{color:var(--mut);font-size:10px}
.lddmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(30,42,58,.14);padding:6px;display:none;z-index:60;min-width:170px}
.langdd.open .lddmenu{display:block}
.lditem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.lditem svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.lditem:hover{background:var(--tint);color:var(--blue)}
.lditem .chk{margin-left:auto;color:var(--blue);font-weight:800}
.navi{padding:2px 12px;display:flex;flex-direction:column;gap:4px;position:relative;z-index:2}
.nitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;
  color:#9FB0CC;font-weight:600;font-size:14px;border-left:4px solid transparent;transition:all .15s}
.nitem svg{flex:0 0 18px}
.nitem:hover{background:rgba(255,255,255,.07);color:#FFFFFF}
.nitem.active{background:linear-gradient(90deg,rgba(59,130,246,.42),rgba(59,130,246,.14));color:#FFFFFF;border-left-color:#4D8DFF}
.sidefill{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
.sidefill img{position:absolute;left:0;right:0;bottom:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;filter:brightness(.75) saturate(1.1)}
.sidefill::before{content:"";position:absolute;left:0;right:0;top:0;height:70px;background:linear-gradient(to bottom,#0A1830,transparent);z-index:1}
.sidefill::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(180deg,rgba(10,24,48,.72),rgba(10,24,48,.28) 45%,rgba(8,19,38,.55));z-index:1}
.adminchip{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid rgba(255,255,255,.14);
  color:#FFFFFF;position:relative;z-index:2;background:rgba(8,19,38,.72)}
.adminchip .av{flex:0 0 36px;height:36px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#CFDCF0;overflow:hidden}
.adminchip .av img{width:100%;height:100%;object-fit:cover;display:block}
.adminchip .nm{flex:1;font-size:13.5px;font-weight:700;line-height:1.25}
.adminchip .nm span{display:block;font-size:11px;color:#9FB0CC;font-weight:500}
.adminchip .arr{color:#9FB0CC;font-size:15px}
@media(max-width:860px){
  .layout{flex-direction:column}
  .side{position:static;height:auto;width:auto;flex:none;flex-direction:row;align-items:center;flex-wrap:wrap;padding-right:10px}
  .navi{flex-direction:row;flex-wrap:wrap;padding:6px}
  .nitem{border-left:none;padding:7px 10px}
  .sidefill,.adminchip{display:none}
  .langsw{padding:6px}
}

/* ---------- main ---------- */
.main{flex:1 1 0;min-width:0;padding:24px 28px 50px;max-width:1280px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:21px;margin:0;font-weight:800}
.pagehead .sub{font-size:13px;color:var(--mut);margin-top:3px}
.phleft{display:flex;align-items:center;gap:14px;min-width:0}
.idlogo{display:flex;align-items:center;padding-right:16px;border-right:2px solid var(--line);flex:0 0 auto}
.idlogo img{height:38px;width:auto;display:block}
@media(max-width:600px){.idlogo{padding-right:11px}.idlogo img{height:28px}}
.datechip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.datechip svg{color:var(--blue);width:15px;height:15px}
.datechip select{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;padding:1px}
.datechip select:focus{outline:2px solid var(--blue);border-radius:6px}
.histnote{display:inline-flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn);
  border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;margin-bottom:14px}
.histnote a{color:var(--blue);cursor:pointer;text-decoration:underline}
.compbanner{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;background:var(--crit-bg);color:var(--crit);
  border:1px solid #F5B5B5;border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;margin-bottom:12px;line-height:1.5}
.compbanner .cbnum{background:var(--crit);color:#fff;border-radius:20px;padding:1px 9px;font-size:12px}
.compbanner .cbunits{color:#8A2b26;font-weight:600}
.compbanner a{color:var(--blue);cursor:pointer;text-decoration:underline;font-weight:700;margin-left:auto}
.compgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:6px}
.compunit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.compunit.ok{background:var(--good-bg);border-color:#B5E4C8}
.compunit.miss{background:var(--crit-bg);border-color:#F5B5B5}
.compunit.part{background:var(--warn-bg);border-color:#F0D9A0}
.compunit .cn{flex:1;font-size:13px;font-weight:700}
.compunit .cn span{display:block;font-size:11px;color:var(--mut);font-weight:500}
.compunit .cs{font-size:16px;font-weight:800}
.comptable td,.comptable th{text-align:center;padding:6px 4px}
.comptable td:first-child,.comptable th:first-child{text-align:left}
.comptable tr.rowbad td{background:#FEF2F2}
.comptable tr.rowwarn td{background:#FEFBEB}
/* ต้องติดตาม */
.followbox{background:linear-gradient(135deg,#FEE2E2,#FEF3F3);border:1px solid #F3B4B4;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.followbox .fbhead{font-size:13px;font-weight:800;color:var(--crit);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.followlist{display:flex;flex-wrap:wrap;gap:8px}
.followitem{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #F0C0C0;border-radius:20px;padding:5px 8px 5px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
.followitem .fdays{background:var(--crit);color:#fff;border-radius:14px;padding:1px 9px;font-size:12px;font-weight:800}
.followitem .fdays.w{background:var(--warn)}
.followok{color:var(--good);font-weight:700;font-size:13px}
/* ปุ่มบันทึกเด่น */
.btn-save{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;font-size:16px;font-weight:800;
  padding:14px 34px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 18px rgba(37,99,235,.38);transition:all .15s;display:inline-flex;align-items:center;gap:9px}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,99,235,.5)}
.btn-save:active{transform:translateY(0)}
.saverow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--tint);border-radius:12px;padding:12px 16px;margin-top:4px}

.backbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--blue);
  color:var(--blue);font-weight:700;font-size:14px;border-radius:10px;padding:7px 16px;cursor:pointer;
  box-shadow:var(--shadow);transition:all .15s;font-family:inherit;margin-bottom:14px}
.backbtn:hover{background:var(--blue);color:#fff}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--cardgrad);border:var(--hair);border-radius:16px;padding:16px 18px 14px;box-shadow:var(--shadow);position:relative;transition:box-shadow .2s,transform .2s}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);pointer-events:none}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.kpi .label{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .value{font-size:34px;font-weight:800;line-height:1.1;margin:6px 0 4px;letter-spacing:-.5px}
.kpi .value .unit{font-size:14px;font-weight:600;color:var(--mut);margin-left:3px}
.kpi .note{font-size:12px;color:var(--mut)}
.kpi .icrow{display:flex;align-items:center;gap:12px;margin-top:2px}
.icbub{flex:0 0 46px;height:46px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.kpi.hero{display:flex;gap:14px;align-items:center;justify-content:space-between}
.kpi.hero .value{font-size:46px;color:var(--blue-dark)}
.chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.c-good{background:var(--good-bg);color:var(--good)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-crit{background:var(--crit-bg);color:var(--crit)}

/* ---------- cards ---------- */
.card{background:var(--cardgrad);border:var(--hair);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:16px;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);pointer-events:none}
.card h2{font-size:14px;margin:0 0 4px;font-weight:800;letter-spacing:.6px;color:var(--ink)}
.card h2 .thin{color:var(--mut);font-weight:600}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}

.railbar{position:relative;height:8px;background:var(--tint2);border-radius:4px;margin:12px 0 8px}
.railbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px}
.railbar .mark{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px}
.railcap{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}

.risk{display:flex;gap:14px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.risk:first-of-type{border-top:none}
.risk .rank{flex:0 0 26px;font-size:24px;font-weight:800;color:var(--blue);text-align:center}
.risk .t{flex:1;font-size:12.5px;color:var(--mut)}
.risk .t .nm{font-weight:800;font-size:14.5px;color:var(--ink);cursor:pointer}
.risk .t .nm:hover{color:var(--blue)}
.risk .ic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.seeall{font-size:12.5px;color:var(--blue);font-weight:700;cursor:pointer;float:right}
.seeall:hover{text-decoration:underline}

.sechead{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-weight:800;font-size:14px}
.sechead:first-of-type{margin-top:2px}
.sechead .swatch{width:11px;height:11px;border-radius:3px}
.sechead .spct{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
.secsplit{display:grid;grid-template-columns:5fr 6fr;gap:26px;align-items:center;margin-top:6px}
@media(max-width:860px){.secsplit{grid-template-columns:1fr;gap:8px}}
.sctitle{font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:2px}
.urow{display:flex;align-items:center;gap:14px;padding:9px 4px;cursor:pointer;border-radius:10px}
.urow:hover{background:var(--tint)}
.urow .uic{flex:0 0 36px;height:36px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.urow .nm{flex:0 0 140px;font-size:14px;font-weight:700}
.urow .bar{flex:1;height:16px;background:var(--tint2);border-radius:5px;position:relative}
.urow .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.urow .bar .mark{position:absolute;top:-4px;width:3px;height:24px;background:var(--ink);border-radius:2px}
.urow .pct{flex:0 0 60px;text-align:right;font-size:16px;font-weight:800}
.urow .st{flex:0 0 84px;text-align:center}
@media(max-width:700px){.urow .nm{flex-basis:105px}.urow .st,.urow .uic{display:none}}

.job{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border-left:5px solid var(--line)}
.job.b-good{border-left-color:var(--good)} .job.b-warn{border-left-color:var(--warn)} .job.b-crit{border-left-color:var(--crit)}
.jobhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:13px 18px;cursor:pointer}
.jobhead:hover{background:var(--tint)}
.jname{flex:1 1 220px;font-size:14.5px;font-weight:700}
.jmeta{flex:0 0 auto;font-size:12px;color:var(--mut)}
.jbar{flex:0 0 160px;height:12px;background:var(--tint2);border-radius:5px;position:relative}
.jchip{flex:0 0 100px;display:flex;justify-content:flex-end}
.jchip .chip{white-space:nowrap}
.jbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.jbar .mark{position:absolute;top:-3px;width:3px;height:18px;background:var(--ink);border-radius:2px}
.jpct{flex:0 0 108px;text-align:right;font-size:16px;font-weight:800}
.jpct .small{font-size:11.5px;color:var(--mut);font-weight:600}
.jobbody{display:none;border-top:1px solid var(--line);padding:6px 18px 16px}
.job.open .jobbody{display:block}
.caret{color:var(--mut);font-size:10px;transition:transform .15s}
.job.open .caret{transform:rotate(90deg)}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:700;padding:9px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th.r,td.r{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--tint)}
.tbar{height:11px;background:var(--tint2);border-radius:4px;position:relative;width:150px}
td.progcell{width:150px}
.tbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tbar .mark{position:absolute;top:-3px;width:3px;height:17px;background:var(--ink);border-radius:2px}
.scrollx{overflow-x:auto}
.small{font-size:12px;color:var(--mut)}
.chartwrap{position:relative}
.chartwrap svg{cursor:zoom-in}
/* ตารางเช็คชื่อรายสัปดาห์ */
.attend{border-collapse:collapse;width:100%;font-size:13px}
.attend th,.attend td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.attend th{font-size:11.5px;color:var(--mut);font-weight:700;vertical-align:bottom}
.attend td.r,.attend th.r{text-align:center}
.attend .wkcur{background:var(--tint)}
.attend th.wkcur{color:var(--blue);border-bottom:2px solid var(--blue)}
.attend tr:hover td{background:var(--tint2)}
.attend tr:hover td.wkcur{background:#DCE9FF}
/* ---- Audit (แท็บรายงาน ข้อ 7) ---- */
.auditsum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--tint);border-radius:10px;padding:9px 14px;margin:4px 0 14px;font-size:13.5px;font-weight:600}
.auditsec{margin:0 0 16px}
.auditsecname{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14.5px;color:var(--ink);margin:14px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--line)}
.auditsecname .swatch{width:12px;height:12px;border-radius:3px}
.auditunit{margin:0 0 10px 2px;padding-left:10px;border-left:3px solid var(--line)}
.auditunitname{font-weight:700;font-size:13.5px;color:var(--ink);margin:8px 0 6px}
.auditjob{margin:0 0 8px 6px}
.auditjobname{font-weight:600;font-size:12.5px;color:var(--mut);margin:6px 0 3px}
.audittbl{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
.audittbl th,.audittbl td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.audittbl th.r,.audittbl td.r{text-align:right}
.audittbl th{font-size:11px;color:var(--mut);font-weight:700}
.audittbl tr:hover td{background:var(--tint2)}
.tagkeep{display:inline-block;background:#EEF2FF;color:#3730A3;border-radius:6px;padding:0 6px;font-size:10.5px;font-weight:700;margin-left:4px}
.modal-ov{position:fixed;inset:0;background:rgba(12,22,40,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-ov.open{display:flex}
.modal-box{background:var(--card);border-radius:16px;padding:20px 24px 22px;max-width:1040px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.4);position:relative}
/* modal บันทึก Task แบบกระชับ (เล็กลง) */
#taskModal .modal-box{padding:15px 18px 17px}
#taskModal h3{font-size:16px;margin:0 0 9px;padding-right:30px}
#taskModal .taskinfo{font-size:11.8px;padding:8px 11px;line-height:1.65;border-radius:9px}
#taskModal .formgrid{gap:9px 10px;margin-bottom:9px}
#taskModal .fld label{font-size:11px}
#taskModal input{padding:8px 10px;font-size:13.5px;border-radius:8px}
#taskModal .btn-save{padding:10px;font-size:14px}
#taskModal .modal-close{top:12px;right:12px}
.wkbadge{background:linear-gradient(90deg,#DC2626,#EF4444);color:#fff;border-radius:10px;padding:9px 13px;font-size:13.5px;font-weight:700;margin-bottom:10px;box-shadow:0 3px 10px rgba(220,38,38,.28)}
.wkbadge b{font-size:16px}
.wkbadge .num{opacity:.9;font-weight:600}
.modalbtns{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modalbtns .btn-o{flex:0 0 auto}
.modalbtns .btn-save{flex:0 0 auto;width:auto;padding-left:18px;padding-right:18px}
.btn-keep{flex:0 0 auto;background:#EEF2FF;color:#3730A3;border:1px solid #C7D2FE;font-weight:700;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer}
.btn-keep:hover{background:#E0E7FF}
.wknav{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 6px}
.wknav .wkbtn{border:none;background:var(--tint);color:var(--blue);border-radius:7px;width:26px;height:26px;font-size:13px;cursor:pointer;font-weight:800}
.wknav .wkbtn:disabled{opacity:.35;cursor:default}
.wknav .wkbtn:not(:disabled):hover{background:var(--blue);color:#fff}
.wknav .wklbl{font-size:12.5px;font-weight:700;color:var(--ink)}
.wknav .wkback{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800}
.modal-box h3{margin:0 34px 14px 0;font-size:16px;font-weight:800;color:var(--ink)}
.modal-close{position:absolute;top:14px;right:16px;width:34px;height:34px;border:none;background:var(--tint);border-radius:9px;cursor:pointer;font-size:17px;color:var(--mut);line-height:1}
.modal-close:hover{background:var(--tint2);color:var(--ink)}
.modal-box .chartwrap svg{cursor:default}
.savepic{position:absolute;top:-2px;right:-2px;width:30px;height:30px;border:1px solid var(--line);background:var(--card);
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mut);box-shadow:var(--shadow);transition:all .15s;z-index:3}
.savepic:hover{color:var(--blue);border-color:var(--blue);background:var(--tint)}
.legendbar{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px;align-items:center}
.legendbar .sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.footnote{text-align:center;font-size:12px;color:var(--mut);margin-top:20px;line-height:1.9}
svg text{font-family:inherit}

/* ---- entry form ---- */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:5px}
.fld select,.fld input{width:100%;padding:10px 12px;border:1.5px solid #AEBED4;border-radius:10px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.fld select{cursor:pointer}
.fld select:hover,.fld input:hover{border-color:#7E93B3}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:10px 22px;
  font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-dark)}
.btn-o{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.btn-o:hover{background:var(--tint)}
.btn-d{background:none;color:var(--crit);border:none;font-size:13px;cursor:pointer;font-family:inherit}
.taskinfo{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.deptlock{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--blue);background:var(--tint);border-radius:10px;font-size:14px}
.deptlock .editlink{margin-left:auto;color:var(--blue);font-size:12px;text-decoration:underline;cursor:pointer}
.deptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:8px}
.deptsections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:10px}
@media(max-width:820px){.deptsections{grid-template-columns:1fr}}
.deptcol{display:flex;flex-direction:column;gap:10px}
.deptcolhd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;padding:2px 2px 6px;border-bottom:2px solid var(--line);margin-bottom:2px}
.deptcolhd .swatch{width:11px;height:11px;border-radius:3px}
.deptcard{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;background:var(--card)}
.deptcard:hover{border-color:var(--blue);background:var(--tint);transform:translateY(-1px);box-shadow:var(--shadow)}
.deptcard .dc-ic{flex:0 0 42px;height:42px;border-radius:10px;background:var(--tint2);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.deptcard .dc-nm{flex:1;font-weight:700;font-size:14.5px;line-height:1.3}
.deptcard .dc-nm span{display:block;font-size:11.5px;color:var(--mut);font-weight:500}
.deptcard .dc-st{font-size:20px;font-weight:800}
.deptbar{display:flex;align-items:center;gap:8px;background:var(--tint);border:1.5px solid var(--blue);border-radius:12px;padding:11px 16px;margin-bottom:14px;font-size:14px}
.deptbar .editlink{margin-left:auto;color:var(--blue);font-size:12.5px;text-decoration:underline;cursor:pointer}
.deptbar .deptname{font-size:18px;font-weight:800;color:var(--blue-dark);letter-spacing:.2px}
.taskrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px dashed var(--line)}
.taskrow:first-child{border-top:none}
.taskrow.rec{background:var(--good-bg);border-radius:8px;padding-left:10px;padding-right:10px;border-top-color:transparent}
.taskrow .tk-main{flex:1;min-width:0}
.taskrow .tk-nm{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.taskrow .tk-gauge{height:9px;background:var(--tint2);border-radius:5px;position:relative;max-width:420px}
.taskrow .tk-gauge .tk-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .4s}
.taskrow .tk-gauge .tk-mark{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);border-radius:1px}
.taskrow .tk-pctline{font-size:11.5px;color:var(--mut);margin-top:4px}
.taskrow .tk-ctl{flex:0 0 auto;text-align:right;white-space:nowrap}
.btnsm{padding:6px 14px !important;font-size:13px !important;border-radius:9px !important}
.jconfirm{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entrysplit{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.entrysplit{grid-template-columns:1fr}}
.joblist{padding:10px}
.joblistitem{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;cursor:pointer;border-left:4px solid transparent;transition:all .12s}
.joblistitem:hover{background:var(--tint)}
.joblistitem.active{background:var(--tint2);border-left-color:var(--blue)}
.joblistitem .jl-nm{flex:1;font-size:13.5px;font-weight:700;line-height:1.35}
.joblistitem .jl-nm span{display:block;font-size:11.5px;color:var(--mut);font-weight:500;margin-top:2px}
.joblistitem .jl-st{font-size:15px;font-weight:800;flex:0 0 auto}
.joblistitem.jdone{background:var(--good-bg);border-color:transparent}
.donebadge{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--good);border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:middle;letter-spacing:.2px}
.jobdetail h3{margin:0 0 4px;font-size:16px;font-weight:800}
.jobdetail .jd-sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.jobdetail{animation:slideRL .3s cubic-bezier(.22,.61,.36,1)}
@keyframes slideRL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
.jobdetail .taskrow{animation:slideRL .34s cubic-bezier(.22,.61,.36,1) both}
.jobdetail .taskrow:nth-child(2){animation-delay:.03s}
.jobdetail .taskrow:nth-child(3){animation-delay:.06s}
.jobdetail .taskrow:nth-child(4){animation-delay:.09s}
.jobdetail .taskrow:nth-child(5){animation-delay:.12s}
.jobdetail .taskrow:nth-child(6){animation-delay:.15s}
.jobdetail .taskrow:nth-child(7){animation-delay:.18s}
.jobdetail .taskrow:nth-child(8){animation-delay:.21s}
.jobdetail .taskrow:nth-child(9){animation-delay:.24s}
@media(prefers-reduced-motion:reduce){.jobdetail,.jobdetail .taskrow{animation:none}}
details.card>summary{cursor:pointer;list-style:none;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::marker{content:""}
.editlink{color:var(--blue);font-weight:600;font-size:12px;margin-left:auto;text-decoration:underline}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--good);color:#fff;
  padding:11px 26px;border-radius:12px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:99}

/* ---- analysis / report ---- */
.prow{display:flex;align-items:center;gap:12px;padding:7px 0}
.prow .pl{flex:0 0 160px;font-size:13.5px;font-weight:600;text-align:right}
.prow .pb{flex:1;height:18px;background:var(--tint2);border-radius:5px;position:relative}
.prow .pb .pf{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.prow .pv{flex:0 0 86px;font-size:14px;font-weight:800}
.repline{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.repline:last-child{border-bottom:none}
.repline .bullet{color:var(--blue);font-weight:800}
@media print{
  .side,.datechip,.backbtn,.seeall,.noprint,.histnote{display:none !important}
  .layout{display:block} .main{padding:0;max-width:none}
  body{background:#fff} html{background:#fff}
  .card,.kpi{box-shadow:none;border:1px solid #D8DEE6;break-inside:avoid}
}
.backbtn:focus-visible,.urow:focus-visible,.jobhead:focus-visible,.nitem:focus-visible,.lbtn:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}

  .deptbar{flex-wrap:wrap}

  .jobhead{gap:6px 10px}
  .jname{flex:1 1 100%}
  .jbar{flex:1 1 120px}
  .jchip{flex:0 0 auto}
}
@media(max-width:480px){
  .main{padding:12px 10px 36px}
  .kpis{grid-template-columns:1fr}
  .pagehead h1{font-size:16.5px}
  .kpi.hero .value{font-size:34px}
  .idlogo img{height:30px}
  .datechip,.lddbtn{font-size:11.5px;padding:5px 9px}
  .taskrow{flex-wrap:wrap}
  .taskrow .tk-ctl{width:100%;text-align:left;margin-top:6px}
  .btn,.btn-save{padding:9px 16px;font-size:14px}
  .risk .ic,.icbub{display:none}
  /* หัว Job มือถือ: บาร์ยืดเต็ม · % และป้ายชิดขวา */
  .jobhead .jbar{flex:1 1 80px;min-width:70px}
  .jobhead .jpct{flex:0 0 auto;font-size:15px}
  .jobhead .jmeta{flex:0 0 100%;order:3}
  /* ตารางเลื่อนแนวนอนได้ พร้อมบอกใบ้ */
  .scrollx{-webkit-overflow-scrolling:touch}
  .prow .pl{flex-basis:120px;font-size:12px}
  .prow .pv{flex-basis:70px;font-size:12.5px}
}

let DATA = MODEL.map(sec => ({...sec, units: sec.units.map(u => {

    const jobs = REAL_JOBS[u.code].map(rj=>{
      const tasks = rj.tasks.map(a=>{
        const s=wkOf(a[1],a[2]), e=Math.max(s+0.14, wkOf(a[3],a[4]));
        const wt=a[5], mh=Math.round(FORCE_TOTAL[u.code]*wt/100);   // น้ำหนัก = แรง (คน-วัน) ตามไฟล์ ไม่คูณชั่วโมง

        return {name:a[0], wt, mh, s, e, plan:w=>Math.max(0,Math.min(1,(w+1-s)/(e-s))), act:0};
      });
      return {name:rj.name, owner:rj.owner, tasks, mh:tasks.reduce((x,t)=>x+t.mh,0), real:true};
    });
    return {...u, jobs, real:true};
  }
  if(REAL_JOBS_WK[u.code]){
    /* แผนกแบบอิงสัปดาห์: สัปดาห์ฤดู = off + สัปดาห์ไฟล์ · น้ำหนัก Task ปรับให้รวม = น้ำหนัก Job (rj.w)
       off = ระยะเลื่อนสัปดาห์ไฟล์→สัปดาห์ฤดู (หม้อไอน้ำเริ่มสัปดาห์ 6 → off=5 · เครื่องกลเริ่มสัปดาห์ 1 → off=0) */
    const off = WK_OFFSET[u.code]||0;
    const deptPlan = WK_DEPTPLAN[u.code];   // true = แผนกยังไม่มีแผนราย Task → ใช้เส้นแผนทางการของแผนก (planU)
    const jobs = REAL_JOBS_WK[u.code].map(rj=>{
      const rawTot = rj.tasks.reduce((x,t)=>x+t[3],0);
      /* rj.realPlan=true → Job นี้มีแผน Gantt ราย Task จริง (ช่วง s–e) แม้แผนกจะตั้ง deptPlan ไว้ ก็ให้ใช้ ramp ราย Task */
      const useDept = deptPlan && !rj.realPlan;
      /* แรงราย Job = เป้าตรงตามไฟล์ · กระจายลง Task แบบ largest-remainder ให้รวมได้เป๊ะ (ไม่เพี้ยนจากปัดเศษราย Task) */
      const jobMh = Math.round(FORCE_TOTAL[u.code]*rj.w/100);
      const exactMh = rj.tasks.map(a=>jobMh*a[3]/rawTot);
      const mhArr = exactMh.map(x=>Math.floor(x));
      let rem = jobMh - mhArr.reduce((x,y)=>x+y,0);
      exactMh.map((x,i)=>[i,x-Math.floor(x)]).sort((p,q)=>q[1]-p[1]).forEach(o=>{ if(rem>0){ mhArr[o[0]]++; rem--; } });
      /* เส้นแผนราย Job: ถ้ามี rj.p18 (=%เป้าหมายสะสมถึงสัปดาห์ 18 ตาม Sheet 18) → เส้น 2 ช่วง (0→P ที่ wk18 → 100% ที่สิ้นงาน)
         ให้ plan(18)=P เป๊ะ · ทุก Task ใน Job ใช้เส้นเดียวกัน (แสดง "กำหนด" ราย Task ตามช่วงจริง) */
      const js=Math.min(...rj.tasks.map(a=>off+a[1])), je=Math.max(...rj.tasks.map(a=>off+a[2]));
      let jobPlan;
      if(rj.p18!=null){
        const P=rj.p18/100;
        jobPlan = (je<=18 || js>18)
          ? (w=>Math.max(0,Math.min(1,(w+1-js)/((je+1)-js))))                         // ไม่คาบสัปดาห์ 18 → ramp ปกติ (plan(18)=100 หรือ 0 = P)
          : (w=> w<js ? 0 : (w+1<=18 ? Math.max(0,P*(w+1-js)/(18+1-js)) : Math.min(1,P+(1-P)*(w-18)/(je-18))));
      }
      const tasks = rj.tasks.map((a,i)=>{
        const s=off+a[1], e=off+a[2];                   // สัปดาห์ฤดู เริ่ม–จบ (แบบรวมสัปดาห์จบ เพื่อให้แสดง "กำหนด" ตรง)
        const wt=Math.round(a[3]/rawTot*rj.w*100)/100;  // % ของแผนก · a[3]=เป้าหมาย(น้ำหนักในJob)
        const mh=mhArr[i];
        const seedAct = a[4]!=null ? a[4] : null;        // a[4]=เกิดจริง(%ในJob) มีเฉพาะ Job ที่ดึงผลจริงราย Task แล้ว
        /* เลือกเส้นแผน: p18 (ตาม Sheet 18) > ramp ราย Task (Gantt) > เส้นแผนแผนก (planU) */
        /* USE_PLANU[dept]=true → บังคับใช้เส้นแผนทางการของแผนก (planU) ทุก Job (ยอดรวมแผนก = ตามรายงาน/R1) แม้ตั้ง p18 ไว้ */
        const plan = USE_PLANU[u.code] ? (w=>planU(u.code,w)) : (jobPlan ? jobPlan : (useDept ? (w=>planU(u.code,w)) : (w=>Math.max(0,Math.min(1,(w+1-s)/((e+1)-s))))));
        return {name:a[0], wt, mh, s, e, seedAct, plan, act:0};
      });
      return {name:rj.name, owner:rj.owner, cur:rj.cur, tasks, mh:jobMh, real:true};
    });
    return {...u, jobs, real:true};
  }
  if(REAL_JOBS_PCT[u.code]){
    /* แผนกที่มีน้ำหนัก+ผลจริงราย  Task เป็น % ในงาน (หม้อต้ม): น้ำหนัก Task = %ในJob × น้ำหนักJob/100
       ผลจริงบันทึกผ่าน Sheet (seedActual) เหมือนแผนกอื่น — a[6] = %จริงในJob เก็บไว้ให้สคริปต์ seed */
    const jobs = REAL_JOBS_PCT[u.code].map(rj=>{
      const tasks = rj.tasks.map(a=>{
        const s=wkOf(a[1],a[2]), e=Math.max(s+0.14, wkOf(a[3],a[4]));
        const wt=Math.round(a[5]*rj.w/100*100)/100;   // % ของแผนก (2 ตำแหน่ง)
        const mh=Math.round(FORCE_TOTAL[u.code]*wt/100);
        const actPct=a[6]!=null?a[6]:0;                // %จริงในJob (สำหรับ seed)
        return {name:a[0], wt, mh, s, e, actPct, plan:w=>Math.max(0,Math.min(1,(w+1-s)/(e-s))), act:0};
      });
      return {name:rj.name, owner:rj.owner, tasks, mh:tasks.reduce((x,t)=>x+t.mh,0), real:true};
    });
    return {...u, jobs, real:true};
  }
  if(REAL_JOBS_ELE[u.code]){
    /* ซ่อมบำรุงไฟฟ้า (ELE): เป้ารวมแผนก = เส้น R1 (planU ทุก Task) · Task บันทึกได้จริง (recordable)
       ผลจริงราย Task = col K (%สำเร็จ · คาดการ) · น้ำหนัก Task ถ่วงด้วย lam=(q−เฉลี่ย)/var
       → ผลรวมถ่วงน้ำหนักราย Job = q (P18 เกิดจริง) เป๊ะ · น้ำหนัก Job = md/1528 */
    const jobs = REAL_JOBS_ELE[u.code].map(rj=>{
      const jobW = Math.round(rj.md/FORCE_TOTAL[u.code]*10000)/100;   // % ของแผนก
      const q = Math.round(rj.q*ELE_QS*100)/100;   // ผลจริงราย Job (สเกลให้ยอดรวม = 65.08)
      const ks0 = rj.tasks.map(t=>+t[1]||0), N=ks0.length;
      const avg = ks0.reduce((a,b)=>a+b,0)/N;
      const minK=Math.min(...ks0), maxK=Math.max(...ks0);
      let ks=ks0, rw;
      if(q < minK-0.01 || q > maxK+0.01){
        /* Q อยู่นอกช่วง %task → ถ่วงน้ำหนักให้ = Q ไม่ได้ · สเกลค่า %task (เท่ากันทุกตัว) ให้เฉลี่ย = Q */
        const f = avg>0 ? q/avg : 0;
        ks = ks0.map(k=>Math.round(Math.min(100,k*f)*100)/100);
        rw = ks0.map(()=>1);
      } else {
        /* Q อยู่ในช่วง → คง %task เดิม ถ่วงน้ำหนัก lam=(q−เฉลี่ย)/var ให้ผลรวม = Q */
        const varr = ks0.reduce((a,k)=>a+(k-avg)*(k-avg),0)/N;
        const lam = varr>0.0001 ? (q-avg)/varr : 0;
        rw = ks0.map(k=>Math.max(0.02, 1+lam*(k-avg)));
      }
      const rwSum = rw.reduce((a,b)=>a+b,0);
      const tasks = rj.tasks.map((t,ti)=>{
        const wt = Math.round(rw[ti]/rwSum*jobW*100)/100;    // % ของแผนก
        const mh = FORCE_TOTAL[u.code]*wt/100;               // ไม่ปัดเศษ → dept = ผลรวมถ่วงน้ำหนักตรง (เลี่ยง drift จากปัดเศษ mh)
        return {name:t[0], wt, mh, s:1, e:WEEKS, seedAct:ks[ti], plan:w=>planU(u.code,w), act:0};
      });
      return {name:rj.name, owner:rj.owner, tasks, mh:rj.md, real:true};
    });
    return {...u, jobs, real:true};
  }
  /* หน่วยงานที่ยังไม่มีแผน Job/Task จริง: เว้นว่างไว้ (blank) แต่คงแผน %/แรงระดับหน่วยตาม R1
     ใช้ task ตัวแทน 1 ตัวถือน้ำหนักทั้งหน่วย + เส้นแผนทางการ เพื่อให้ยอดรวมส่วน/โรงงานยังถูกต้อง
     task ตัวแทนนี้ถูกซ่อนจากทุกหน้ารายการ Job/Task (placeholder) รอนำเข้าของจริงภายหลัง */
  const sw=UNIT_STARTW[u.code];
  const ptask={name:"(รอนำเข้าแผนงานจริง)", wt:100, mh:Math.max(1,Math.round(FORCE_TOTAL[u.code])),
               s:sw, e:WEEKS, plan:w=>planU(u.code,w), act:0, placeholder:true};
  const jobs=[{name:"(รอนำเข้าแผนงานจริง)", tasks:[ptask], mh:ptask.mh, placeholder:true}];
  return {...u, jobs, blank:true};
})}));

/* ผูกแผนจริงเข้ากับโครงสร้าง:
   - น้ำหนักของแต่ละหน่วย = จำนวนแรง (คน-วัน) จริงของแผนก → การถ่วงน้ำหนักข้ามแผนกตรงตาม Sheet "รวม"
   - % แผนทุกระดับใช้ S-curve ทางการของแผนก (แรงสะสม ÷ แรงรวม)
   - ช่วงสัปดาห์ของ Task บีบให้อยู่ในหน้าต่างทำงานจริงของแผนก (BLR/GEN เริ่มสัปดาห์ 6) */
DATA.forEach(sec=>sec.units.forEach(u=>{

  const tot=tks.reduce((s,t)=>s+t.mh,0);
  tks.forEach(t=>{ if(t.wt==null) t.wt=Math.round(t.mh/tot*10000)/100; });
}));

function normDate(d){
  if(typeof d==="string" && /^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10);
  const dt=new Date(d);
  if(!isNaN(dt.getTime())) return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  return String(d);
}
async function syncFromSheet(attempt, silent){
  attempt=attempt||1;
  if(!SHEET_API){ SYNC_STATE="off"; return; }
  /* silent = การดึงเบื้องหลัง (poll/สลับแท็บ) ไม่ต้องโชว์สถานะ "กำลังดึง" ให้กวนใจ — คงสถานะเขียวไว้ ข้อมูลเดิมยังใช้ได้ */
  try{
    const res=await fetch(SHEET_API+(SHEET_API.includes("?")?"&":"?")+"action=list",{method:"GET",cache:"no-store"});
    const txt=await res.text();
    let data; try{ data=JSON.parse(txt); }catch(_){ throw new Error("non-json"); }   /* บางครั้ง Google ตอบหน้า HTML ชั่วคราว */
    if(!Array.isArray(data)) throw new Error("bad payload");
    /* เกราะกันข้อมูลหาย: ถ้าเซิร์ฟเวอร์ตอบว่างแต่เครื่องเรามีข้อมูลอยู่ ให้ลองซ้ำก่อนยอมรับ (กันจังหวะ Sheet สะดุด) */
    if(data.length===0 && ENTRIES.length>0 && attempt<4) throw new Error("empty while local has data");
    ENTRIES=data.map(e=>({date:normDate(e.date), taskId:String(e.taskId), pct:Number(e.pct), mh:Number(e.mh)||0, by:e.by||"", note:e.note||""})).filter(e=>!ignoredEntry(e));
    saveEntries(ENTRIES); applyEntries(); SYNC_STATE="ok";
    SYNC_TIME=new Date();
    /* re-render เฉพาะเมื่อข้อมูลเปลี่ยนจริง และไม่ได้อยู่ในหน้าย่อย/ฟอร์มบันทึก (กันเด้งกลับเอง) */
    const sig=entriesSig(), changed=(sig!==LAST_SIG); LAST_SIG=sig;
    const m=document.getElementById("taskModal"), modalOpen=m&&m.classList.contains("open");
    if(changed && !modalOpen && !SUBVIEW) go(PAGE);
    else { const c=document.getElementById("syncChipBox"); if(c) c.innerHTML=syncChip(); }
  }catch(err){
    /* ลองซ้ำอัตโนมัติสูงสุด 5 ครั้ง — retry แบบเงียบ ไม่โชว์ "กำลังดึง" (คงสถานะเดิม/เขียว เพราะข้อมูลเดิมยังดี) */
    if(attempt<5){ if(!silent && attempt===1 && ENTRIES.length===0){ SYNC_STATE="connecting"; const c=document.getElementById("syncChipBox"); if(c) c.innerHTML=syncChip(); }
      setTimeout(function(){ syncFromSheet(attempt+1, silent); }, 2500*attempt); }
    else if(ENTRIES.length===0){ SYNC_STATE="error"; if(PAGE==="entry") entryPage(); }
    /* ถ้ามีข้อมูลอยู่แล้ว ปล่อยสถานะเป็น ok เดิม ไม่ต้องแจ้ง error */
  }
}

function applyEntries(){
  Object.values(TASK_INDEX).forEach(x=>{ x.t.act = x.t.mockAct; });
  const latest = {};
  ENTRIES.forEach(en=>{ if(!latest[en.taskId] || en.date >= latest[en.taskId].date) latest[en.taskId]=en; });
  /* ค่าที่บันทึก (pct) = แต้มสะสมที่เก็บได้ของ Task (0 – น้ำหนัก Task) → แปลงเป็นสัดส่วนของ Task */
  Object.entries(latest).forEach(([tid,en])=>{ if(TASK_INDEX[tid]){ const t=TASK_INDEX[tid].t; t.act = Math.max(0,Math.min(1,(en.pct||0)/(t.wt||1))); } });
}
applyEntries();

/* ---- การเช็คการบันทึกรายสัปดาห์ (compliance) · update ทุกวันเสาร์ ---- */
function dateISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* แปลงวันที่ (yyyy-mm-dd) → เลขสัปดาห์ของฤดูซ่อม (1..WEEKS) · 0 = นอกช่วง */
function seasonWeekOf(dateStr){
  const p=String(dateStr).slice(0,10).split("-"); if(p.length<3) return 0;
  const t=Date.UTC(+p[0], +p[1]-1, +p[2]);
  const w=Math.floor((t-Date.UTC(2026,3,20))/(7*86400000))+1;
  return (w>=1 && w<=WEEKS) ? w : 0;
}
/* วันเสาร์ (วัน update ประจำสัปดาห์) ของสัปดาห์ที่กำลังดู */
function weekSaturday(w){ return new Date(2026,3,20+(w-1)*7+5); }
/* entry ที่มาจากการนำเข้าข้อมูลย้อนหลัง (ไม่ใช่การบันทึกจริงของผู้ใช้) */
function isImportEntry(e){ return /นำเข้า|แก้วันที่|^\s*test/i.test(e.by||""); }
/* entry นี้นับเป็น "บันทึกของสัปดาห์ w" ไหม — สัปดาห์ baseline(≤18) นับข้อมูลนำเข้าด้วย · สัปดาห์ live(19+) นับเฉพาะบันทึกจริง */
function countsForWeek(e, w){ if(seasonWeekOf(e.date)!==w) return false; return w<=BASELINE_WK || !isImportEntry(e); }
/* ---- Audit: entry ล่าสุดของ Task ในสัปดาห์ w (ที่ user กรอกจริง) + ค่าสะสมก่อนหน้าสัปดาห์ w ---- */
function taskWeekEntry(tid, w){
  let best=null;
  ENTRIES.forEach(e=>{ if(e.taskId===tid && countsForWeek(e,w) && (!best || e.date>=best.date)) best=e; });
  return best;
}
function taskPrevPct(tid, w, wt){
  let best=null;
  ENTRIES.forEach(e=>{ const ew=seasonWeekOf(e.date); if(e.taskId===tid && ew>0 && ew<w && (ew<=BASELINE_WK||!isImportEntry(e)) && (!best||e.date>=best.date)) best=e; });
  return best ? best.pct/(wt||1)*100 : 0;
}
function isKeepEntry(e){ return /คงค่าเดิม|keep|ຄົງຄ່າ/.test(e&&e.note||""); }
function unitsRecordedOn(dateStr){
  const set=new Set();
  ENTRIES.forEach(e=>{ if(e.date===dateStr) set.add(e.taskId.split("-")[0]); });
  return set;
}
/* Job/Task ที่แสดงจริง (ตัด placeholder ของหน่วยที่ยังไม่มีแผนงานจริงออก) */
function visJobs(u){ return u.blank ? [] : u.jobs; }
/* Task ที่ยังต้องบันทึก (เริ่มแล้ว ยังไม่เสร็จ) ของหน่วยงาน ณ สัปดาห์ปัจจุบัน */
function activeTasksOf(u){
  return unitTasks(u).filter(t=> !t.placeholder && t.s<=WNOW && actAt(t,WNOW)<1 );
}
/* สถานะการบันทึกของ "สัปดาห์ที่กำลังดู": none=ไม่บันทึก, partial=ไม่ครบ, full=ครบ (ระดับ Task) */
function complianceToday(){
  const tasksByUnit={};   // code -> Set(taskId ที่บันทึกในสัปดาห์นี้ — สัปดาห์ live นับเฉพาะบันทึกจริง)
  ENTRIES.forEach(e=>{ if(countsForWeek(e,WNOW)){
    const code=e.taskId.split("-")[0];
    (tasksByUnit[code]=tasksByUnit[code]||new Set()).add(e.taskId);
  }});
  /* เช็คเฉพาะหน่วยที่มีแผน Job/Task จริงแล้ว — หน่วย blank ยังไม่นับว่าต้องบันทึก */
  return DATA.flatMap(s=>s.units.filter(u=>!u.blank).map(u=>{
    const active=activeTasksOf(u).length;
    const logged=tasksByUnit[u.code]?tasksByUnit[u.code].size:0;
    const state = logged===0 ? "none" : (logged>=active ? "full" : "partial");
    return {sec:s,u,done:logged>0,logged,active,state};
  }));
}

/* ---- ผลจริง ณ สัปดาห์ y้อนหลัง: สเกลตามรูปทรงแผน ---- */
function actAt(t,w){
  /* anchor ที่สัปดาห์รายงาน (ข้อมูลจริง update ถึง REPORT_WK) — w≥REPORT_WK คืนค่าจริงเต็ม · ก่อนหน้านั้นประมาณตามสัดส่วนแผน (ใช้วาดเส้น S-curve ย้อนหลัง) */
  if(w>=REPORT_WK) return t.act;
  const p0=t.plan(REPORT_WK);
  if(p0<=0) return 0;
  return Math.min(t.act, t.act*Math.min(1, t.plan(w)/p0));
}
const sum = a => a.reduce((x,y)=>x+y,0);
function agg(tasks, w){ const mh=sum(tasks.map(t=>t.mh));
  return {mh, plan:sum(tasks.map(t=>t.mh*t.plan(w)))/mh*100, act:sum(tasks.map(t=>t.mh*actAt(t,w)))/mh*100,
          actMh:sum(tasks.map(t=>t.mh*actAt(t,w)))}; }
const unitTasks = u=>u.jobs.flatMap(j=>j.tasks),
      secTasks = s=>s.units.flatMap(unitTasks), allTasks = DATA.flatMap(secTasks);
const CFG={warn:0,crit:7};   /* ไม่เผื่อ tolerance: ตามแผนเฉพาะเมื่อผลจริง ≥ แผน · ตามหลังแม้แต่จุดเดียว = เสี่ยงทันที */
function statusOf(v){ return v>=-CFG.warn?[pk(["ตามแผน","ຕາມແຜນ","On plan"]),"good"]:v>=-CFG.crit?[pk(["เสี่ยง","ສ່ຽງ","At risk"]),"warn"]:[pk(["ล่าช้า","ຊັກຊ້າ","Late"]),"crit"]; }
const fmt1 = x=>x.toLocaleString("th-TH",{maximumFractionDigits:2,minimumFractionDigits:2});
const fmt0 = x=>Math.round(x).toLocaleString("th-TH");
function wkStart(w){ return new Date(2026,3,20+(w-1)*7); }
function wkEnd(w){ return new Date(2026,3,18+w*7); }   /* สัปดาห์ทำงาน จ.–ส. (เช่น สัปดาห์ 1 = 20–25 เม.ย.) */

  return `<svg width="${size}" height="${size}" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="#E3EDFC" stroke-width="9"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 46 46)"/>
    <g transform="translate(28,35)" fill="#AFC1DE">
      <rect x="0" y="12" width="36" height="10" rx="1"/>
      <rect x="3" y="5" width="5" height="17" rx="1.5"/>
      <rect x="11" y="0" width="5" height="22" rx="1.5"/>
      <path d="M20 22 V9 l6 -3 v16 z"/>
      <rect x="28" y="7" width="6" height="15" rx="1"/>
    </g>
  </svg>`;
}
function sCurve(tasks, lineColor="#2563EB", w=720, h=260, curW){
  curW = curW||WNOW;
  const P=[...Array(WEEKS+1).keys()].map(i=>agg(tasks,i).plan);
  const Act=[...Array(curW+1).keys()].map(wk=>agg(tasks,wk).act);
  const mL=42,mR=16,mT=18,mB=32, iw=w-mL-mR, ih=h-mT-mB;
  const X=wk=>mL+iw*wk/WEEKS, Y=v=>mT+ih*(1-v/100);
  const path=(arr,n)=>arr.slice(0,n+1).map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const months=MON[LI()].slice(3,10);
  let g="";
  for(let v=0;v<=100;v+=25) g+=`<line x1="${mL}" x2="${w-mR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EAF0F8" stroke-width="1"/>
      <text x="${mL-8}" y="${Y(v)+4}" font-size="11" fill="#64748B" text-anchor="end">${v}</text>`;
  months.forEach((m,i)=>{ const wk=i*WEEKS/7+WEEKS/14; g+=`<text x="${X(wk)}" y="${h-9}" font-size="11" fill="#64748B" text-anchor="middle">${m}</text>`; });
  const xN=X(curW), yA=Y(Act[curW]);
  const area = path(Act,curW)+`L${X(curW)},${Y(0)} L${X(0)},${Y(0)} Z`;
  return `<div class="chartwrap"><button class="savepic noprint" title="${pk(["บันทึกกราฟเป็นรูป","ບັນທຶກກຣາຟເປັນຮູບ","Save chart as image"])}" onclick="saveChart(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg></button>
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" onclick="openChartModal(this)"
    <text x="${mL-8}" y="10" font-size="10.5" fill="#94A3B8">(%)</text>
    ${g}
    <path d="${area}" fill="${lineColor}" opacity="0.10"/>
    <line x1="${xN}" x2="${xN}" y1="${mT}" y2="${mT+ih}" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="3 4"/>
    <text x="${xN+7}" y="${mT+13}" font-size="11" fill="#64748B">${pk(["สัปดาห์","ສັບປະດາ","Week"])} ${curW}</text>
    <path d="${path(P,WEEKS)}" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="${path(Act,curW)}" fill="none" stroke="${lineColor}" stroke-width="3"/>
    <circle cx="${xN}" cy="${yA}" r="5" fill="${lineColor}"/>
    <text x="${xN-10}" y="${yA-12}" font-size="15" fill="#1E2A3A" text-anchor="end" font-weight="800">${fmt1(Act[curW])}%</text>
  </svg>
  <div class="legendbar"><span><span class="sw" style="background:${lineColor}"></span>${pk(["ผลจริงสะสม (% ถ่วง mh)","ຜົນຕົວຈິງສະສົມ (% ຖ່ວງ mh)","Cumulative actual (mh-weighted %)"])}</span>
  <span><span class="sw" style="background:none;border-top:3px dashed #94A3B8;height:0"></span>${pk(["แผนสะสมรายสัปดาห์","ແຜນສະສົມລາຍອາທິດ","Weekly plan baseline"])}</span></div></div>`;
}

function openChartModal(svg){
  const wrap=svg.closest(".chartwrap"); if(!wrap) return;
  const card=svg.closest(".card"), sec=svg.closest(".secchart");
  const title = card&&card.querySelector("h2") ? card.querySelector("h2").innerText
    : (sec&&sec.querySelector(".sctitle") ? sec.querySelector(".sctitle").innerText : "S-Curve");
  document.getElementById("modalTitle").textContent=title;
  const clone=wrap.cloneNode(true);
  const body=document.getElementById("modalBody"); body.innerHTML=""; body.appendChild(clone);
  document.getElementById("chartModal").classList.add("open");
}

/* ============ บันทึกกราฟเป็นรูป PNG ============ */
function saveChart(btn){
  const wrap=btn.closest(".chartwrap"); if(!wrap) return;
  const svg=wrap.querySelector("svg"); if(!svg) return;
  const vb=svg.viewBox.baseVal, w=(vb&&vb.width)||720, h=(vb&&vb.height)||260, scale=2.5;
  let name=(btn.closest(".card")&&btn.closest(".card").querySelector("h2")?btn.closest(".card").querySelector("h2").innerText:(btn.closest(".secchart")&&btn.closest(".secchart").querySelector(".sctitle")?btn.closest(".secchart").querySelector(".sctitle").innerText:"chart"));
  name=("iDash_"+name).replace(/[^\w฀-໿.-]+/g,"_").slice(0,60);
  const xml=new XMLSerializer().serializeToString(svg);
  const src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
  const img=new Image();
  img.onload=function(){
    const c=document.createElement("canvas"); c.width=w*scale; c.height=h*scale;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(blob){
      const url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download=name+".png"; document.body.appendChild(a); a.click();
      setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); },100);
    },"image/png");
  };
  img.onerror=function(){ alert(pk(["บันทึกรูปไม่สำเร็จ ลองใหม่อีกครั้ง","ບັນທຶກຮູບບໍ່ສຳເລັດ","Could not save image"])); };
  img.src=src;
}

function go(p){ PAGE=p; SUBVIEW=false; if(p==='entry'){ DEPT=""; SELJOB=null; } renderNav(); ({over:overview,jobs:jobsPage,units:unitsPage,entry:entryPage,ana:anaPage,rep:repPage})[p](); window.scrollTo(0,0); }

function weekChip(){
  const opts=[...Array(REALWK).keys()].map(i=>{const w=i+1;
    return `<option value="${w}" ${w===WNOW?"selected":""}>${pk(["สัปดาห์","ສັບປະດາ","Week"])} ${w} · ${fmtDate(wkEnd(w))}</option>`;}).join("");
  return `<div class="datechip">${IC(ICONS.cal,18)}<span class="num">20 ${MON[LI()][3]} ${LANG==="th"?2569:2026} –</span>
    <select id="wkSel" onchange="setWeek(this.value)" title="${pk(["เลือกดูข้อมูลย้อนหลัง","ເລືອກເບິ່ງຂໍ້ມູນຍ້ອນຫຼັງ","View historical data"])}">${opts}</select></div>`;
}

function syncChip(){
  const t = SYNC_TIME ? SYNC_TIME.getHours().toString().padStart(2,"0")+":"+SYNC_TIME.getMinutes().toString().padStart(2,"0") : "";
  if(SYNC_STATE==="ok") return `<span class="num" style="font-size:11.5px;color:var(--good);white-space:nowrap" title="${pk(["ข้อมูลล่าสุดจาก Google Sheet","ຂໍ້ມູນຫຼ້າສຸດ","Synced from Google Sheet"])}">🟢 ${pk(["ซิงก์","ຊິງ","synced"])} ${t}</span>`;
  if(SYNC_STATE==="connecting") return `<span class="num" style="font-size:11.5px;color:var(--warn);white-space:nowrap">🟡 ${pk(["กำลังดึงข้อมูล…","ກຳລັງດຶງ…","syncing…"])}</span>`;
  return `<span class="num" style="font-size:11.5px;color:var(--crit);white-space:nowrap">🔴 ${pk(["เชื่อมต่อไม่ได้","ເຊື່ອມບໍ່ໄດ້","offline"])} <a style="cursor:pointer;text-decoration:underline" onclick="syncFromSheet()">${pk(["ลองใหม่","ລອງໃໝ່","retry"])}</a></span>`;
}
function pagehead(title,sub){ return `<div class="pagehead"><div class="phleft">${IDLOGO}<div><h1>${title}</h1><div class="sub">${sub}</div></div></div><div class="headctl"><span id="syncChipBox">${syncChip()}</span>${langChip()}${weekChip()}</div></div>${histBanner()}`; }
function unitBub(name,sz=22){ return IC(ICONS[UNIT_ICON[name]]||ICONS.gear,sz); }
function riskRows(w){
  w = w||WNOW;
  /* จัดอันดับเสี่ยง/ล่าช้าเฉพาะหน่วยที่มีแผน Job/Task จริง — หน่วย blank ยังไม่นำมาจัดอันดับ (ยังไม่มีข้อมูลจริง) */
  return DATA.flatMap(s=>s.units.filter(u=>!u.blank).map(u=>({sec:s,u,a:agg(unitTasks(u),w)})))
    .map(x=>({...x,varc:x.a.act-x.a.plan,st:statusOf(x.a.act-x.a.plan)}));
}

/* ============ ภาพรวม ============ */
function overview(){
  const SCc={good:"#16A34A",warn:"#D97706",crit:"#EF4444"};
  const RW=REPORT_WK;   /* ภาพรวมเทียบกับ "สัปดาห์รายงาน" (ล่าสุดที่ update แล้ว) — ตอนนี้ = 18 · เลื่อนเป็น 19 เมื่อถึงเสาร์ */
  const f=agg(allTasks,RW), varc=f.act-f.plan, [fLbl,fTone]=statusOf(varc);
  const rows=riskRows(RW);
  const late=rows.filter(r=>r.st[1]==="crit"), risk=rows.filter(r=>r.st[1]==="warn");
  const jobsAll=DATA.flatMap(s=>s.units.flatMap(u=>visJobs(u)));
  const jobsDone=jobsAll.filter(j=>agg(j.tasks,RW).act>=99.5).length;
  /* นับถอยหลังทีละวันจาก "วันนี้จริง" ถึงวันเปิดหีบ (31 ต.ค. 2569) — เปิดเว็บวันไหนเลขลดทุกวัน */
  const _n=new Date(), _today=new Date(_n.getFullYear(),_n.getMonth(),_n.getDate());
  const daysLeft=Math.max(0,Math.ceil((SEASON_END-_today)/86400000));
  const compAll=complianceToday();
  const noneU=compAll.filter(x=>x.state==="none"), partU=compAll.filter(x=>x.state==="partial");
  const dueTxt=pk(["update สัปดาห์นี้ เสาร์ "+fmtDate(weekSaturday(WNOW)),"ອັບເດດ ວັນເສົາ "+fmtDate(weekSaturday(WNOW)),"update Sat "+fmtDate(weekSaturday(WNOW))]);
  const wkTxt=pk(["สัปดาห์ที่ "+WNOW+"/"+WEEKS,"ອາທິດທີ "+WNOW+"/"+WEEKS,"Week "+WNOW+"/"+WEEKS]);
  const compBanner = (noneU.length===0 && partU.length===0) ? "" :
    `<div class="compbanner">📅 <b>${wkTxt}</b> · <b>${dueTxt}</b> ·
     ${noneU.length?`<span class="cbnum num">${noneU.length}</span> ${pk(["ยังไม่บันทึกสัปดาห์นี้","ຍັງບໍ່ບັນທຶກ","not recorded"])}: <span class="cbunits">${noneU.map(x=>un(x.u.name)).join(" · ")}</span>`:""}
     ${partU.length?`<span class="cbnum num" style="background:var(--warn)">${partU.length}</span> ${pk(["บันทึกไม่ครบ","ບັນທຶກບໍ່ຄົບ","partial"])}: <span class="cbunits">${partU.map(x=>un(x.u.name)+" ("+x.logged+"/"+x.active+")").join(" · ")}</span>`:""}
     <a onclick="go('entry')">${pk(["บันทึก ›","ບັນທຶກ ›","Record ›"])}</a></div>`;
  app.innerHTML = pagehead(pk(["ความคืบหน้าของงานซ่อม","ຄວາມຄືບໜ້າຂອງວຽກສ້ອມແປງ","Maintenance Progress"]),
    pk(["ผลจริงถึงสิ้นสัปดาห์","ຜົນຕົວຈິງຮອດທ້າຍອາທິດ","As of end of week"])+" "+RW+" ("+fmtDate(wkEnd(RW))+") · "+pk(["เทียบเป้าสัปดาห์","ທຽບເປົ້າອາທິດ","vs target wk"])+" "+RW+"/"+WEEKS
    +" · "+pk(["ทำงาน","ເຮັດວຽກ","workdays"])+" "+PLAN_DAYS[RW-1]+" "+pk(["วัน","ວັນ","days"])+" · "+pk(["กำลังพลตามแผน","ກຳລັງພົນຕາມແຜນ","planned force"])+" "+fmt0(WEEK_FORCE[RW-1])+" "+pk(["แรง","ແຮງ","man-days"])) + compBanner + `
  <div class="kpis">
    <div class="kpi hero">
      <div>
        <div class="label">${pk(["ความคืบหน้ารวมทั้งโรงงาน","ຄວາມຄືບໜ້າລວມທັງໂຮງງານ","Factory-wide progress"])}</div>
        <div class="value num" style="color:${SCc[fTone]}">${fmt1(f.act)}<span class="unit">%</span></div>
        <div class="note num"><span class="chip c-${fTone}">${varc>=0?"▲":"▼"} ${fmt1(Math.abs(varc))} ${pk(["จุด เทียบแผน","ຈຸດ ທຽບແຜນ","pts vs plan"])} (${fmt1(f.plan)}%) — ${fLbl}</span></div>
      </div>
      ${donut(f.act, SCc[fTone])}
    </div>
    <div class="kpi"><div class="label">${pk(["แรงงานสะสม","ແຮງງານສະສົມ","Man-days used"])}</div>
      <div class="icrow"><span class="icbub">${IC(ICONS.people)}</span>
        <div><div class="value num" style="font-size:28px;margin:0">${fmt0(f.actMh)}</div><div class="small">${pk(["แรง","ແຮງ","man-days"])}</div></div></div>
      <div class="note num" style="margin-top:6px">${pk(["จากแผนทั้งฤดูกาล","ຈາກແຜນທັງລະດູການ","of season plan"])} ${fmt0(SEASON_FORCE)}</div></div>
    <div class="kpi"><div class="label">${pk(["JOB เสร็จ","JOB ສຳເລັດ","Jobs done"])}</div>

    <div class="kpi"><div class="label">${pk(["หน่วยล่าช้า / เสี่ยง","ໜ່ວຍຊັກຊ້າ / ສ່ຽງ","Late / at-risk units"])}</div>
      <div style="display:flex;gap:18px;align-items:flex-end;margin-top:2px">

          <div class="small" style="color:var(--crit);font-weight:700;margin-top:3px">🔴 ${pk(["ล่าช้า","ຊັກຊ້າ","late"])}</div></div>

/* ============ บันทึกข้อมูล ============ */
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* ล็อกแผนก: เลือกครั้งเดียว แล้วหน้าบันทึกโชว์เฉพาะงานของแผนกนั้น */
let DEPT="";  /* เริ่มที่หน้าเลือกแผนกทุกครั้ง (ไม่จำแผนกเดิม) */
function unitByCode(code){ return DATA.flatMap(s=>s.units).find(u=>u.code===code); }
let SELJOB=null;
function setDept(code){ DEPT=code||""; SELJOB=null; entryPage(); }
function selectJob(jid){ SELJOB=jid; document.querySelectorAll('.joblistitem').forEach(function(el){ el.classList.toggle('active', el.getAttribute('onclick').indexOf("'"+jid+"'")>-1); }); var d=document.querySelector('.jobdetail'); if(d){ d.innerHTML=jobDetailHtml(); } else { entryDeptPage(); } }
function clearAllData(){
  if(!confirm(pk(["⚠️ ล้างข้อมูลบันทึกทั้งหมด (ทั้งในเครื่องและใน Google Sheet)? ย้อนกลับไม่ได้","⚠️ ລ້າງຂໍ້ມູນທັງໝົດ? ຍ້ອນກັບບໍ່ໄດ້","⚠️ Clear ALL records (device + Google Sheet)? Cannot undo"]))) return;
  try{ localStorage.removeItem("idash_entries"); localStorage.removeItem("idash_jobconf"); }catch(e){}
  ENTRIES=[]; JOBCONF={}; applyEntries();
  if(SHEET_API){
    fetch(SHEET_API+"?action=clear").then(function(r){return r.json();}).then(function(res){
      if(res && res.cleared){ ENTRIES=[]; saveEntries(ENTRIES); applyEntries();
        alert(pk(["✓ ล้างข้อมูลทั้งหมดแล้ว (เครื่อง + Google Sheet)","✓ ລ້າງແລ້ວ","✓ Cleared device + Google Sheet"])); }
      else { alert(pk(["ล้างในเครื่องแล้ว — แต่ Google Sheet ยังไม่ถูกล้าง\nต้องอัปเดตโค้ด Apps Script รุ่นใหม่ (มี action=clear) แล้ว Deploy → New version ก่อน\nหรือลบแถวในแท็บ Daily_Input เองก็ได้","ລ້າງໃນເຄື່ອງແລ້ວ — ຕ້ອງອັບເດດ Apps Script","Cleared device only — update the Apps Script (add action=clear) & redeploy, or delete rows in Daily_Input manually"])); }
      go('entry');
    }).catch(function(){ alert(pk(["ล้างในเครื่องแล้ว (เชื่อม Sheet ไม่สำเร็จ)","ລ້າງໃນເຄື່ອງແລ້ວ","Cleared device (sheet unreachable)"])); go('entry'); });
  } else { alert(pk(["ล้างข้อมูลในเครื่องแล้ว","ລ້າງແລ້ວ","Cleared"])); go('entry'); }
}
/* ===== flow บันทึกแบบไล่ขั้น: เลือกแผนก → Job → Task → ฟอร์ม → ยืนยัน Job ===== */
/* บันทึกแล้วใน "สัปดาห์ที่กำลังดู" หรือยัง (เปลี่ยนจากรายวันเป็นรายสัปดาห์) */
function recordedToday(tid){ return ENTRIES.some(e=>e.taskId===tid && countsForWeek(e,WNOW)); }
function jobActiveTasks(j){ return j.tasks.filter(t=> t.s<=WNOW && actAt(t,WNOW)<1 ); }
let JOBCONF={}; try{ JOBCONF=JSON.parse(localStorage.getItem("idash_jobconf")||"{}"); }catch(e){}
function jobConfKey(jid){ return todayISO()+"|"+jid; }
function isJobConfirmed(jid){ return !!JOBCONF[jobConfKey(jid)]; }
function confirmJob(jid){
  const j=DATA.flatMap(s=>s.units).flatMap(u=>u.jobs).find(x=>x.id===jid);
  const act=jobActiveTasks(j), done=act.filter(t=>recordedToday(t.id)).length;
  if(act.length>0 && done<act.length){ alert(pk(["ยังบันทึกไม่ครบทุก Task ของงานนี้","ຍັງບັນທຶກບໍ່ຄົບທຸກ Task","Not all tasks recorded yet"])); return; }
  JOBCONF[jobConfKey(jid)]=true; try{ localStorage.setItem("idash_jobconf",JSON.stringify(JOBCONF)); }catch(e){}
  entryDeptPage();
  const t=document.getElementById("entryToast"); if(t){ t.innerHTML=`<div class="toast">✓ ${pk(["ยืนยัน Job แล้ว","ຢືນຢັນ Job ແລ້ວ","Job confirmed"])}</div>`; setTimeout(()=>t.innerHTML="",2500); }
}

function entryPage(){ if(!DEPT) entryPickerPage(); else entryDeptPage(); }

/* หน้าเลือกแผนก */
function entryPickerPage(){
  const comp=complianceToday();
  const cols=DATA.map(s=>{
    const items=s.units.map(u=>{
      const c=comp.find(x=>x.u.code===u.code);
      /* หน่วย blank (ยังไม่มีแผนจริง) ไม่มีสถานะบันทึก แสดงจุดเทา "รอข้อมูล" */
      const st=c?c.state:"blank";
      const col=st==="full"?"var(--good)":st==="partial"?"var(--warn)":st==="blank"?"var(--mut)":"var(--crit)";
      const ic=st==="full"?"✓":st==="partial"?"◐":st==="blank"?"·":"✗";
      return `<div class="deptcard" tabindex="0" onclick="setDept('${u.code}')">
        <div class="dc-ic">${unitBub(u.name,20)}</div>
        <div class="dc-nm">${un(u.name)}<span>${u.owner}</span></div>
        <div class="dc-st" style="color:${col}" title="${st==="blank"?pk(["รอนำเข้าแผนงานจริง","ລໍຖ້ານຳເຂົ້າ","awaiting real data"]):""}">${ic}</div></div>`;}).join("");
    return `<div class="deptcol"><div class="deptcolhd"><span class="swatch" style="background:${s.color}"></span>${un(s.name)}</div>${items}</div>`;}).join("");
  app.innerHTML = pagehead(pk(["บันทึก % งานซ่อมรายสัปดาห์","ບັນທຶກ % ວຽກສ້ອມແປງລາຍອາທິດ","Weekly Progress Entry"]),
    pk(["เลือกแผนกของคุณเพื่อเข้าไปบันทึกงาน · update ทุกวันเสาร์","ເລືອກໜ່ວຍງານຂອງທ່ານ · ອັບເດດທຸກວັນເສົາ","Choose your unit to record · update every Saturday"])) + `
  <div class="card"><h2>👇 ${pk(["เลือกแผนกของคุณ","ເລືອກໜ່ວຍງານຂອງທ່ານ","Select your unit"])}</h2>
    <div class="sub">${pk(["📅 บันทึกทุกสัปดาห์ · update ทุกวันเสาร์ — กดแผนกของคุณเพื่อบันทึก (✓ ครบ · ◐ ไม่ครบ · ✗ ยังไม่บันทึกสัปดาห์นี้)","📅 ບັນທຶກທຸກອາທິດ · ອັບເດດທຸກວັນເສົາ (✓ ຄົບ · ◐ ບໍ່ຄົບ · ✗ ຍັງບໍ່ບັນທຶກ)","📅 Record weekly · update every Saturday — tap your unit (✓ full · ◐ partial · ✗ none this week)"])}</div>
    <div class="deptsections">${cols}</div>
  </div>`;
}

/* หน้าแผนกของตน: รายการ Job → Task → บันทึก → ยืนยัน */
function jobDetailHtml(){
  const u=unitByCode(DEPT); if(!u) return '';
  const j=u.jobs.find(x=>x.id===SELJOB);
  let right="";
  if(j){
    const act=jobActiveTasks(j), doneToday=act.filter(t=>recordedToday(t.id)).length;
    const conf=isJobConfirmed(j.id), allDone=act.length>0 && doneToday>=act.length;
    const ja=agg(j.tasks,WNOW);
    right=`<h3>${tr(j.name)}</h3>
      <div class="jd-sub num">${j.id} · ${pk(["สัปดาห์นี้บันทึก","ອາທິດນີ້ບັນທຶກ","this week"])} ${doneToday}/${act.length} task · ${pk(["รวม","ລວມ","total"])} ${fmt1(ja.act)}% / ${pk(["แผน","ແຜນ","plan"])} ${fmt1(ja.plan)}%</div>
      ${j.tasks.slice().sort((a,b)=>(actAt(a,WNOW)>=1?1:0)-(actAt(b,WNOW)>=1?1:0)).map(t=>{ const rec=recordedToday(t.id), done=actAt(t,WNOW)>=1, ta=actAt(t,WNOW)*100, tp=t.plan(WNOW)*100, cur=fmt1(ta);
        const cc=done?"#16A34A":(statusOf(ta-tp)[1]==="good"?"#16A34A":statusOf(ta-tp)[1]==="warn"?"#D97706":"#EF4444");
        return `<div class="taskrow ${rec?'rec':''}">
          <div class="tk-main">
            <span class="tk-nm">${tr(t.name)}</span>
            <div class="tk-gauge"><div class="tk-fill" style="width:${ta}%;background:${cc}"></div><div class="tk-mark" style="left:${tp}%"></div></div>
            <div class="tk-pctline num"><b style="color:${cc}">${fmt1(ta/100*t.wt)}</b>/${t.wt} ${pk(["แต้ม","ແຕ້ມ","pts"])} (${cur}%) · ${pk(["เป้า","ເປົ້າ","target"])} ${fmt1(tp/100*t.wt)} ${pk(["แต้ม","ແຕ້ມ","pts"])}${done?" · ✓":""}</div>
          </div>
          <div class="tk-ctl">${done ? `<span class="chip c-good">${pk(["เสร็จแล้ว","ສຳເລັດ","Done"])}</span>`
            : rec ? `<span class="chip c-good">✓ ${pk(["บันทึกสัปดาห์นี้","ບັນທຶກອາທິດນີ້","logged this week"])}</span><br><button class="btn btn-o btnsm" style="margin-top:6px" onclick="openTaskForm('${t.id}')">${pk(["แก้ไข","ແກ້ໄຂ","edit"])}</button>`
            : `<button class="btn btn-p btnsm" onclick="openTaskForm('${t.id}')">✍ ${pk(["บันทึก","ບັນທຶກ","Record"])}</button>`}</div>
        </div>`;}).join("")}
      <div class="jconfirm">
        <button class="btn ${allDone&&!conf?'btn-p':'btn-o'}" ${(!allDone||conf)?'disabled style="opacity:.5;cursor:default"':''} onclick="confirmJob('${j.id}')">
          ${conf?`✓ ${pk(["ยืนยัน Job แล้ว","ຢືນຢັນ Job ແລ້ວ","Job confirmed"])}`:`✓ ${pk(["ยืนยัน Job นี้","ຢືນຢັນ Job ນີ້","Confirm this job"])}`}</button>
        ${!allDone&&!conf?`<span class="small">${pk(["ต้องบันทึกครบทุก Task ก่อน","ຕ້ອງບັນທຶກຄົບກ່ອນ","record all tasks first"])} (${doneToday}/${act.length})</span>`:""}
      </div>`;
  } else { right=`<div class="small">${pk(["เลือก Job จากด้านซ้าย","ເລືອກ Job ຈາກຊ້າຍ","Select a job on the left"])}</div>`; }
  return right;
}
function entryDeptPage(){
  const u=unitByCode(DEPT); if(!u){ setDept(""); return; }
  SUBVIEW=true;   // หน้าบันทึกของแผนก — กัน auto-sync เด้งกลับ
  const jl=visJobs(u);
  if(SELJOB && !jl.some(j=>j.id===SELJOB)) SELJOB=null;
  if(!SELJOB && jl.length) SELJOB=jl[0].id;
  const allTasksToday=unitTasks(u).filter(t=>recordedToday(t.id)).length;
  const totalActive=activeTasksOf(u).length;
  const left=jl.length? jl.map(j=>{
    const act=jobActiveTasks(j), dn=act.filter(t=>recordedToday(t.id)).length, conf=isJobConfirmed(j.id);
    const jpct=agg(j.tasks,WNOW).act, jdone=jpct>=99.5;   // Job เสร็จ 100% แล้วหรือยัง
    const st = jdone?`<span style="color:var(--good)">✔</span>` : conf?`<span style="color:var(--good)">✓</span>` : (act.length&&dn>=act.length?`<span style="color:var(--warn);font-weight:800">●</span>` : dn>0?`<span style="color:var(--warn);font-weight:800">◐</span>` : `<span style="color:var(--crit);font-weight:900;font-size:16px">✗</span>`);
    return `<div class="joblistitem ${j.id===SELJOB?'active':''} ${jdone?'jdone':''}" tabindex="0" onclick="selectJob('${j.id}')">
      <span class="jl-nm">${tr(j.name)}<span class="num">${jdone?pk(["ทั้ง Job เสร็จแล้ว","ທັງ Job ສຳເລັດ","job complete"]):(pk(["สัปดาห์นี้","ອາທິດນີ້","this wk"])+" "+dn+"/"+act.length+" task")} · ${fmt1(jpct)}%</span></span>
      <span class="jl-st">${st}</span></div>`;}).join("")
    : `<div class="small" style="padding:14px 10px;color:var(--mut)">📋 ${pk(["ยังไม่มีแผนงานของหน่วยนี้ รอนำเข้าข้อมูลจริง","ຍັງບໍ່ມີແຜນວຽກ ລໍຖ້ານຳເຂົ້າ","No work plan yet — awaiting real data"])}</div>`;
  const right = jobDetailHtml();
  app.innerHTML = pagehead(un(u.name)+" — "+pk(["บันทึกงาน","ບັນທຶກງານ","Record work"]),
    un(DATA.find(s=>s.units.includes(u)).name)+" · "+u.owner) + `
  <div class="deptbar">
    <button class="btn btn-o btnsm" onclick="setDept('')">← ${pk(["กลับ","ກັບຄືນ","Back"])}</button>
    <span class="deptname">🔒 ${un(u.name)}</span>
    <span class="wknav">
      <button class="wkbtn" ${WNOW<=1?'disabled':''} onclick="entryWeek(-1)" title="${pk(["สัปดาห์ก่อนหน้า (กรอกย้อนหลัง)","ອາທິດກ່ອນ","previous week"])}">◀</button>
      <span class="wklbl">${pk(["บันทึกของสัปดาห์","ບັນທຶກຂອງອາທິດ","Recording week"])} <b>${WNOW}</b>${WNOW<REALWK?` <span class="wkback">${pk(["ย้อนหลัง","ຍ້ອນຫຼັງ","past"])}</span>`:""}</span>
      <button class="wkbtn" ${WNOW>=REALWK?'disabled':''} onclick="entryWeek(1)" title="${pk(["สัปดาห์ถัดไป","ອາທິດຖັດໄປ","next week"])}">▶</button>
    </span>
    <span class="small" style="margin-left:auto">${pk(["บันทึกแล้ว","ບັນທຶກແລ້ວ","recorded"])} <b class="num" style="color:var(--ink);font-size:14px">${allTasksToday}/${totalActive}</b> task</span></div>
  <div class="entrysplit">
    <div class="card joblist"><div class="sub" style="padding:2px 8px 6px">${pk(["งานของแผนก","ວຽກຂອງໜ່ວຍ","Unit jobs"])}</div>${left}</div>
    <div class="card jobdetail">${right}</div>
  </div>
  <div id="entryToast"></div>`;
}

function latestEntryFor(tid){
  let last=null;
  ENTRIES.forEach(e=>{ if(e.taskId===tid && (!last || e.date>=last.date)) last=e; });
  return last;
}
function openTaskForm(tid){
  const x=TASK_INDEX[tid]; if(!x) return;
  const lastE=latestEntryFor(tid);
  const wt=x.t.wt, curPts=Math.round(x.t.act*wt*100)/100;
  const floor=latestPctFor(tid), fl=floor!=null?floor:0;
  const prefill = lastE ? lastE.pct : curPts;   // เด้งแต้มล่าสุด ถ้ายังไม่เคยบันทึกใช้ค่าปัจจุบัน
  const tgtPts=Math.round(x.t.plan(REALWK)*wt*100)/100;
  document.getElementById("taskModalTitle").textContent=tr(x.t.name);
  document.getElementById("taskModalBody").innerHTML=`
    <div class="wkbadge">🗓️ ${pk(["กำลังบันทึกของ สัปดาห์ที่","ກຳລັງບັນທຶກ ອາທິດທີ","Recording for Week"])} <b>${WNOW}</b> <span class="num">(${fmtDate(wkStart(WNOW))}–${fmtDate(wkEnd(WNOW))})</span> · ${pk(["update ภายในเสาร์","ອັບເດດພາຍໃນວັນເສົາ","update by Sat"])} ${fmtDate(weekSaturday(WNOW))}</div>
    <div class="taskinfo num">⚖️ ${pk(["น้ำหนัก Task นี้","ນ້ຳໜັກ Task ນີ້","Task weight"])} <b>${wt}</b> ${pk(["แต้ม (แผนกเต็ม 100)","ແຕ້ມ (ໜ່ວຍເຕັມ 100)","pts (unit = 100)"])} · ${pk(["สัปดาห์","ສັບປະດາ","wk"])} ${Math.max(1,Math.round(x.t.s))}–${Math.min(WEEKS,Math.round(x.t.e))}
    <br>🎯 ${pk(["เป้าสะสมถึงตอนนี้","ເປົ້າສະສົມຮອດຕອນນີ້","Target to date"])} <b>${tgtPts}</b> ${pk(["แต้ม","ແຕ້ມ","pts"])} (${fmt1(x.t.plan(REALWK)*100)}% ${pk(["ของ Task","ຂອງ Task","of task"])})
    <br>${lastE?`📈 ${pk(["แต้มล่าสุด","ແຕ້ມຫຼ້າສຸດ","latest"])} <b>${lastE.pct}</b> (${pk(["บันทึกเมื่อ","ບັນທຶກເມື່ອ","on"])} ${lastE.date}) — ${pk(["กรอกต่อจากนี้","ປ້ອນຕໍ່ຈາກນີ້","continue from here"])}`:`${pk(["ยังไม่เคยบันทึก · แต้มปัจจุบัน","ຍັງບໍ່ເຄີຍບັນທຶກ · ແຕ້ມປັດຈຸບັນ","No record yet · current"])} <b>${curPts}</b>`}
    <br><span style="color:var(--warn)">🔒 ${pk(["กรอกได้ไม่ต่ำกว่า","ປ້ອນໄດ້ບໍ່ຕ່ຳກວ່າ","must be ≥"])} ${fl} ${pk(["แต้ม (สะสม ห้ามถอยหลัง)","ແຕ້ມ","pts"])}</span></div>
    <input type="hidden" id="tfTid" value="${tid}">
    <div class="formgrid">
      <div class="fld"><label>📅 ${pk(["วันที่บันทึก","ວັນທີ","Date"])}</label><input id="tfDate" type="date" value="${dateISO(new Date(Math.min(weekSaturday(WNOW).getTime(), Date.now())))}" max="${todayISO()}"></div>
      <div class="fld"><label>⚖️ ${pk(["แต้มสะสมที่ทำได้","ແຕ້ມສະສົມທີ່ເຮັດໄດ້","Points earned (cum.)"])} <span class="num">(0–${wt})</span></label><input id="tfPct" type="number" min="${fl}" max="${wt}" step="0.01" value="${Math.max(fl,prefill)}" oninput="tfPctHint(this.value,${wt})"><div id="tfPctHint" class="small num"></div></div>
      <div class="fld"><label>${pk(["ผู้บันทึก","ຜູ້ບັນທຶກ","By"])}</label><input id="tfBy" type="text"></div>
    </div>
    <div class="fld" style="margin-bottom:12px"><label>${pk(["หมายเหตุ","ໝາຍເຫດ","Note"])}</label><input id="tfNote" type="text"></div>
    <div class="modalbtns">
      <button class="btn btn-o" onclick="closeTaskForm()">${pk(["ยกเลิก","ຍົກເລີກ","Cancel"])}</button>
      <button class="btn btn-keep" onclick="keepTaskForm()" title="${pk(["ไม่มีการเปลี่ยนแปลง คงค่าเดิม แค่เช็คอินว่ามา update แล้ว","ຄົງຄ່າເດີມ ພຽງເຊັກອິນ","No change — check-in only"])}">↔️ ${pk(["คงตัวเดิม","ຄົງເດີມ","Keep as-is"])}</button>
      <button class="btn-save" onclick="saveTaskForm()">💾 ${pk(["บันทึก","ບັນທຶກ","Save"])}</button>
    </div>`;
  document.getElementById("taskModal").classList.add("open");
  tfPctHint(Math.max(fl,prefill), wt);
}
function tfPctHint(v,wt){
  const el=document.getElementById("tfPctHint"); if(!el) return;
  const p=parseFloat(v);
  el.textContent = isNaN(p) ? "" : "= "+fmt1(Math.max(0,Math.min(1,p/wt))*100)+"% "+pk(["ของ Task นี้","ຂອງ Task ນີ້","of this task"]);
}
function closeTaskForm(){ document.getElementById("taskModal").classList.remove("open"); }
function saveTaskForm(){
  const tid=document.getElementById("tfTid").value;
  const wt=TASK_INDEX[tid]?TASK_INDEX[tid].t.wt:100;
  const pct=parseFloat(document.getElementById("tfPct").value);
  if(isNaN(pct)||pct<0||pct>wt+0.001){ alert(pk(["กรอกแต้มระหว่าง 0–"+wt,"ປ້ອນແຕ້ມ 0–"+wt,"Enter points 0–"+wt])); return; }
  const floor=latestPctFor(tid);
  if(floor!=null && pct<floor){ alert(pk(["แต้มสะสมต้องไม่น้อยกว่าค่าล่าสุด ("+floor+" แต้ม)","ຕ້ອງບໍ່ໜ້ອຍກວ່າ ("+floor+" ແຕ້ມ)","Must be ≥ latest ("+floor+" pts)"])); return; }
  const d=document.getElementById("tfDate").value||todayISO();
  if(d>todayISO()){ alert(pk(["เลือกวันอนาคตไม่ได้","ບໍ່ໄດ້","No future date"])); return; }
  const entry={date:d, taskId:tid, pct:pct, mh:0,
    by:document.getElementById("tfBy").value.trim(), note:document.getElementById("tfNote").value.trim()};
  ENTRIES.push(entry); saveEntries(ENTRIES); applyEntries(); pushToSheet(entry);
  closeTaskForm(); entryDeptPage();
  const t=document.getElementById("entryToast"); if(t){ t.innerHTML=`<div class="toast">✓ ${pk(["บันทึกแล้ว","ບັນທຶກແລ້ວ","Saved"])}</div>`; setTimeout(()=>t.innerHTML="",2500); }
}
/* คงตัวเดิม = ไม่มีการเปลี่ยนแปลง คงค่า % เดิมไว้ แต่เช็คอินว่าสัปดาห์นี้มา update แล้ว (นับเป็นบันทึกของสัปดาห์) */
function keepTaskForm(){
  const tid=document.getElementById("tfTid").value;
  const x=TASK_INDEX[tid]; if(!x) return;
  const wt=x.t.wt;
  const floor=latestPctFor(tid);
  const pct=(floor!=null)?floor:Math.round(x.t.act*wt*100)/100;   // ค่าเดิม (แต้มสะสมล่าสุด/ปัจจุบัน)
  const d=dateISO(new Date(Math.min(weekSaturday(WNOW).getTime(), Date.now())));
  const by=(document.getElementById("tfBy").value||"").trim();
  const entry={date:d, taskId:tid, pct:pct, mh:0, by:by, note:pk(["คงค่าเดิม (เช็คอิน)","ຄົງຄ່າເດີມ","keep (check-in)"])};
  ENTRIES.push(entry); saveEntries(ENTRIES); applyEntries(); pushToSheet(entry);
  closeTaskForm(); entryDeptPage();
  const t=document.getElementById("entryToast"); if(t){ t.innerHTML=`<div class="toast">↔️ ${pk(["เช็คอินแล้ว (คงค่าเดิม)","ເຊັກອິນແລ້ວ","Checked in (kept)"])}</div>`; setTimeout(()=>t.innerHTML="",2500); }
}

function _unused_oldEntry(){
  const todays=ENTRIES.filter(e=>e.date===todayISO()).length;
  const comp=complianceToday(), fullN=comp.filter(x=>x.state==="full").length, partN=comp.filter(x=>x.state==="partial").length, noneN=comp.filter(x=>x.state==="none").length;
  const days=[...Array(7).keys()].map(i=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});
  // สรุปวินัยราย 7 วัน + จัดอันดับ "ต้องติดตาม"
  const stat=DATA.flatMap(s=>s.units).map(u=>{
    const marks=days.map(d=>unitsRecordedOn(dateISO(d)).has(u.code));
    const rec=marks.filter(Boolean).length;
    return {u, marks, rec, miss:7-rec, pct:Math.round(rec/7*100)};
  });
  const follow=stat.filter(x=>x.miss>0).sort((a,b)=>b.miss-a.miss);
  const followBox = `<div class="followbox">
    <div class="fbhead">🔔 ${pk(["หน่วยงานที่ต้องติดตาม (ขาดบันทึกใน 7 วันล่าสุด)","ໜ່ວຍງານທີ່ຕ້ອງຕິດຕາມ (ຂາດບັນທຶກໃນ 7 ວັນຫຼ້າສຸດ)","Units to follow up (missed entries, last 7 days)"])}</div>

function latestPctFor(tid){
  let last=null;
  ENTRIES.forEach(e=>{ if(e.taskId===tid && (!last || e.date>=last.date)) last=e; });
  return last ? last.pct : null;
}
function entryTaskChanged(){
  const tid=document.getElementById("fTask").value, x=TASK_INDEX[tid], inp=document.getElementById("fPct");
  const lastPct = tid ? latestPctFor(tid) : null;
  const floor = lastPct!=null ? lastPct : (x? Math.round(x.t.act*100) : 0);   // ห้ามต่ำกว่าค่านี้
  document.getElementById("taskInfo").innerHTML = x?
    `<div class="taskinfo num">📌 <b>${tr(x.t.name)}</b> · ${pk(["แผน","ແຜນ","plan"])} ${fmt0(x.t.mh)} ${pk(["แรง","ແຮງ","man-days"])} · ${pk(["สัปดาห์","ສັບປະດາ","wk"])} ${Math.max(1,Math.round(x.t.s))}–${Math.min(WEEKS,Math.round(x.t.e))} ·
     ${pk(["% แผนตอนนี้","% ແຜນຕອນນີ້","plan now"])} <b>${fmt1(x.t.plan(REALWK)*100)}%</b> · ${pk(["% ปัจจุบัน","% ປັດຈຸບັນ","current"])} <b>${fmt1(x.t.act*100)}%</b>
     <br><span style="color:var(--warn)">🔒 ${pk(["กรอกได้ไม่ต่ำกว่า","ປ້ອນໄດ້ບໍ່ຕ່ຳກວ່າ","must be ≥"])} ${floor}% ${pk(["(ความคืบหน้าสะสม ห้ามถอยหลัง)","(ຄວາມຄືບໜ້າສະສົມ ຫ້າມຖອຍຫຼັງ)","(cumulative — cannot go backward)"])}</span></div>`:"";
  if(x){ inp.min=floor; inp.value=Math.max(floor, Math.round(x.t.act*100)); inp.dataset.floor=floor; }
}
function saveEntry(){
  const tEl=document.getElementById("fTask");
  if(!tEl){ alert(pk(["กรุณาเลือกแผนกของคุณก่อน","ກະລຸນາເລືອກໜ່ວຍງານກ່ອນ","Please select your unit first"])); return; }
  const tid=tEl.value;
  const pct=parseFloat(document.getElementById("fPct").value);
  if(!tid){ alert(pk(["กรุณาเลือกหน่วยงาน → Job → Task ให้ครบ","ກະລຸນາເລືອກໜ່ວຍງານ → Job → Task ໃຫ້ຄົບ","Please select Unit → Job → Task"])); return; }
  if(isNaN(pct)||pct<0||pct>100){ alert(pk(["กรุณากรอก % ระหว่าง 0–100","ກະລຸນາປ້ອນ % ລະຫວ່າງ 0–100","Enter % between 0–100"])); return; }
  const floor = latestPctFor(tid);
  if(floor!=null && pct<floor){ alert(pk(["ค่าความคืบหน้าสะสมต้องไม่น้อยกว่าค่าล่าสุด ("+floor+"%) — งานถอยหลังไม่ได้","ຄ່າຄວາມຄືບໜ້າສະສົມຕ້ອງບໍ່ໜ້ອຍກວ່າຄ່າຫຼ້າສຸດ ("+floor+"%)","Cumulative progress cannot be lower than the latest value ("+floor+"%)"])); return; }
  let entryDate=document.getElementById("fDate").value || todayISO();
  if(entryDate>todayISO()){ alert(pk(["เลือกวันที่ในอนาคตไม่ได้","ເລືອກວັນທີໃນອະນາຄົດບໍ່ໄດ້","Cannot select a future date"])); return; }
  const entry={date:entryDate, taskId:tid, pct:pct,
    mh:parseFloat(document.getElementById("fMh").value)||0,
    by:document.getElementById("fBy").value.trim(),
    note:document.getElementById("fNote").value.trim()};
  ENTRIES.push(entry);
  saveEntries(ENTRIES); applyEntries(); pushToSheet(entry); entryPage();
  const t=document.getElementById("entryToast");
  t.innerHTML=`<div class="toast">✓ ${pk(["บันทึกแล้ว — dashboard อัปเดตทันที","ບັນທຶກແລ້ວ — dashboard ອັບເດດທັນທີ","Saved — dashboard updated"])}</div>`;
  setTimeout(()=>{ t.innerHTML=""; },2500);
}
function delEntry(i){

  ENTRIES.splice(i,1); saveEntries(ENTRIES); applyEntries(); entryPage();
}
function exportEntries(){
  if(ENTRIES.length===0){ alert(pk(["ยังไม่มีข้อมูลให้ export","ຍັງບໍ່ມີຂໍ້ມູນ","No data to export"])); return; }
  const head="วันที่,รหัส Task,% ความคืบหน้าสะสม (0-100),man-hr ที่ใช้วันนี้,ผู้บันทึก,หมายเหตุ";
  const csv="﻿"+head+"\n"+ENTRIES.map(e=>[e.date,e.taskId,e.pct,e.mh,'"'+(e.by||"").replace(/"/g,'""')+'"','"'+(e.note||"").replace(/"/g,'""')+'"'].join(",")).join("\n");

    const a=document.createElement("a");

  }catch(err){}

}
