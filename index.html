<title>iDash MaintTrack</title>
<style>
:root{
  --bg:#F3F7FC; --card:#FFFFFF; --line:#E4EAF2; --tint:#EFF5FF; --tint2:#E3EDFC;
  --ink:#1E2A3A; --mut:#64748B;
  --blue:#2563EB; --blue-dark:#1D4ED8; --blue-soft:#DBEAFE;
  --good:#16A34A; --good-bg:#DCFCE7;
  --warn:#D97706; --warn-bg:#FEF3C7;
  --crit:#EF4444; --crit-bg:#FEE2E2;
  --shadow:0 2px 12px rgba(30,42,58,.06);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai","Noto Sans Lao",Tahoma,sans-serif;font-size:14.5px;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.layout{display:flex;min-height:100vh;align-items:stretch}

/* ---------- sidebar (dark navy) ---------- */
.side{flex:0 0 208px;width:208px;background:linear-gradient(180deg,#0D2246 0%,#0A1830 60%,#081326 100%);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:20px 16px 12px}
.logo img{width:44px;height:44px;object-fit:contain;flex:0 0 44px;border-radius:10px}
.lname{font-weight:800;font-size:15px;color:#FFFFFF;line-height:1.15;letter-spacing:.3px}
.lname span{display:block;font-size:10px;letter-spacing:.5px;color:#7FB2E8;font-weight:700}
.headctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.langdd{position:relative}
.lddbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow);transition:all .15s;user-select:none}
.lddbtn:hover{border-color:var(--blue);color:var(--blue)}
.lddbtn svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.lddbtn .dd{color:var(--mut);font-size:10px}
.lddmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 8px 24px rgba(30,42,58,.14);padding:6px;display:none;z-index:60;min-width:170px}
.langdd.open .lddmenu{display:block}
.lditem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.lditem svg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.lditem:hover{background:var(--tint);color:var(--blue)}
.lditem .chk{margin-left:auto;color:var(--blue);font-weight:800}
.navi{padding:2px 12px;display:flex;flex-direction:column;gap:4px;position:relative;z-index:2}
.nitem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;
  color:#9FB0CC;font-weight:600;font-size:14px;border-left:4px solid transparent;transition:all .15s}
.nitem svg{flex:0 0 18px}
.nitem:hover{background:rgba(255,255,255,.07);color:#FFFFFF}
.nitem.active{background:linear-gradient(90deg,rgba(59,130,246,.42),rgba(59,130,246,.14));color:#FFFFFF;border-left-color:#4D8DFF}
.sidefill{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
.sidefill img{position:absolute;left:0;right:0;bottom:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;filter:brightness(.75) saturate(1.1)}
.sidefill::before{content:"";position:absolute;left:0;right:0;top:0;height:70px;background:linear-gradient(to bottom,#0A1830,transparent);z-index:1}
.sidefill::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(180deg,rgba(10,24,48,.72),rgba(10,24,48,.28) 45%,rgba(8,19,38,.55));z-index:1}
.adminchip{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid rgba(255,255,255,.14);
  color:#FFFFFF;position:relative;z-index:2;background:rgba(8,19,38,.72)}
.adminchip .av{flex:0 0 34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#CFDCF0}
.adminchip .nm{flex:1;font-size:13.5px;font-weight:700;line-height:1.25}
.adminchip .nm span{display:block;font-size:11px;color:#9FB0CC;font-weight:500}
.adminchip .arr{color:#9FB0CC;font-size:15px}
@media(max-width:860px){
  .layout{flex-direction:column}
  .side{position:static;height:auto;width:auto;flex:none;flex-direction:row;align-items:center;flex-wrap:wrap;padding-right:10px}
  .navi{flex-direction:row;flex-wrap:wrap;padding:6px}
  .nitem{border-left:none;padding:7px 10px}
  .sidefill,.adminchip{display:none}
  .langsw{padding:6px}
}

/* ---------- main ---------- */
.main{flex:1 1 0;min-width:0;padding:24px 28px 50px;max-width:1280px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:21px;margin:0;font-weight:800}
.pagehead .sub{font-size:13px;color:var(--mut);margin-top:3px}
.datechip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:7px 12px;font-size:13.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.datechip svg{color:var(--blue)}
.datechip select{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;padding:2px}
.datechip select:focus{outline:2px solid var(--blue);border-radius:6px}
.histnote{display:inline-flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn);
  border-radius:10px;padding:6px 14px;font-size:13px;font-weight:700;margin-bottom:14px}
.histnote a{color:var(--blue);cursor:pointer;text-decoration:underline}
.compbanner{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;background:var(--crit-bg);color:var(--crit);
  border:1px solid #F5B5B5;border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;margin-bottom:12px;line-height:1.5}
.compbanner .cbnum{background:var(--crit);color:#fff;border-radius:20px;padding:1px 9px;font-size:12px}
.compbanner .cbunits{color:#8A2b26;font-weight:600}
.compbanner a{color:var(--blue);cursor:pointer;text-decoration:underline;font-weight:700;margin-left:auto}
.compgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:6px}
.compunit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.compunit.ok{background:var(--good-bg);border-color:#B5E4C8}
.compunit.miss{background:var(--crit-bg);border-color:#F5B5B5}
.compunit .cn{flex:1;font-size:13px;font-weight:700}
.compunit .cn span{display:block;font-size:11px;color:var(--mut);font-weight:500}
.compunit .cs{font-size:16px;font-weight:800}
.comptable td,.comptable th{text-align:center;padding:6px 4px}
.comptable td:first-child,.comptable th:first-child{text-align:left}
.comptable tr.rowbad td{background:#FEF2F2}
.comptable tr.rowwarn td{background:#FEFBEB}
/* ต้องติดตาม */
.followbox{background:linear-gradient(135deg,#FEE2E2,#FEF3F3);border:1px solid #F3B4B4;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.followbox .fbhead{font-size:13px;font-weight:800;color:var(--crit);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.followlist{display:flex;flex-wrap:wrap;gap:8px}
.followitem{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #F0C0C0;border-radius:20px;padding:5px 8px 5px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
.followitem .fdays{background:var(--crit);color:#fff;border-radius:14px;padding:1px 9px;font-size:12px;font-weight:800}
.followitem .fdays.w{background:var(--warn)}
.followok{color:var(--good);font-weight:700;font-size:13px}
/* ปุ่มบันทึกเด่น */
.btn-save{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;font-size:16px;font-weight:800;
  padding:14px 34px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 18px rgba(37,99,235,.38);transition:all .15s;display:inline-flex;align-items:center;gap:9px}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,99,235,.5)}
.btn-save:active{transform:translateY(0)}
.saverow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--tint);border-radius:12px;padding:12px 16px;margin-top:4px}

.backbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--blue);
  color:var(--blue);font-weight:700;font-size:14px;border-radius:10px;padding:7px 16px;cursor:pointer;
  box-shadow:var(--shadow);transition:all .15s;font-family:inherit;margin-bottom:14px}
.backbtn:hover{background:var(--blue);color:#fff}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border-radius:16px;padding:16px 18px 14px;box-shadow:var(--shadow)}
.kpi .label{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi .value{font-size:34px;font-weight:800;line-height:1.1;margin:6px 0 4px;letter-spacing:-.5px}
.kpi .value .unit{font-size:14px;font-weight:600;color:var(--mut);margin-left:3px}
.kpi .note{font-size:12px;color:var(--mut)}
.kpi .icrow{display:flex;align-items:center;gap:12px;margin-top:2px}
.icbub{flex:0 0 46px;height:46px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.kpi.hero{display:flex;gap:14px;align-items:center;justify-content:space-between}
.kpi.hero .value{font-size:46px;color:var(--blue-dark)}
.chip{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.c-good{background:var(--good-bg);color:var(--good)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-crit{background:var(--crit-bg);color:var(--crit)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 4px;font-weight:800;letter-spacing:.6px;color:var(--ink)}
.card h2 .thin{color:var(--mut);font-weight:600}
.card .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}

.railbar{position:relative;height:8px;background:var(--tint2);border-radius:4px;margin:12px 0 8px}
.railbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px}
.railbar .mark{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px}
.railcap{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}

.risk{display:flex;gap:14px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.risk:first-of-type{border-top:none}
.risk .rank{flex:0 0 26px;font-size:24px;font-weight:800;color:var(--blue);text-align:center}
.risk .t{flex:1;font-size:12.5px;color:var(--mut)}
.risk .t .nm{font-weight:800;font-size:14.5px;color:var(--ink);cursor:pointer}
.risk .t .nm:hover{color:var(--blue)}
.risk .ic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.seeall{font-size:12.5px;color:var(--blue);font-weight:700;cursor:pointer;float:right}
.seeall:hover{text-decoration:underline}

.sechead{display:flex;align-items:center;gap:10px;margin:16px 0 4px;font-weight:800;font-size:14px}
.sechead:first-of-type{margin-top:2px}
.sechead .swatch{width:11px;height:11px;border-radius:3px}
.sechead .spct{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
.secsplit{display:grid;grid-template-columns:5fr 6fr;gap:26px;align-items:center;margin-top:6px}
@media(max-width:860px){.secsplit{grid-template-columns:1fr;gap:8px}}
.sctitle{font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:2px}
.urow{display:flex;align-items:center;gap:14px;padding:9px 4px;cursor:pointer;border-radius:10px}
.urow:hover{background:var(--tint)}
.urow .uic{flex:0 0 36px;height:36px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.urow .nm{flex:0 0 140px;font-size:14px;font-weight:700}
.urow .bar{flex:1;height:16px;background:var(--tint2);border-radius:5px;position:relative}
.urow .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.urow .bar .mark{position:absolute;top:-4px;width:3px;height:24px;background:var(--ink);border-radius:2px}
.urow .pct{flex:0 0 60px;text-align:right;font-size:16px;font-weight:800}
.urow .st{flex:0 0 84px;text-align:center}
@media(max-width:700px){.urow .nm{flex-basis:105px}.urow .st,.urow .uic{display:none}}

.job{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border-left:5px solid var(--line)}
.job.b-good{border-left-color:var(--good)} .job.b-warn{border-left-color:var(--warn)} .job.b-crit{border-left-color:var(--crit)}
.jobhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:13px 18px;cursor:pointer}
.jobhead:hover{background:var(--tint)}
.jname{flex:1 1 260px;font-size:14.5px;font-weight:700}
.jmeta{font-size:12px;color:var(--mut)}
.jbar{flex:1 1 130px;max-width:190px;height:12px;background:var(--tint2);border-radius:5px;position:relative}
.jbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.jbar .mark{position:absolute;top:-3px;width:3px;height:18px;background:var(--ink);border-radius:2px}
.jpct{flex:0 0 108px;text-align:right;font-size:16px;font-weight:800}
.jpct .small{font-size:11.5px;color:var(--mut);font-weight:600}
.jobbody{display:none;border-top:1px solid var(--line);padding:6px 18px 16px}
.job.open .jobbody{display:block}
.caret{color:var(--mut);font-size:10px;transition:transform .15s}
.job.open .caret{transform:rotate(90deg)}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--mut);text-align:left;font-weight:700;padding:9px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th.r,td.r{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--tint)}
.tbar{height:11px;background:var(--tint2);border-radius:4px;position:relative;min-width:100px}
.tbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tbar .mark{position:absolute;top:-3px;width:3px;height:17px;background:var(--ink);border-radius:2px}
.scrollx{overflow-x:auto}
.small{font-size:12px;color:var(--mut)}
.legendbar{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px;align-items:center}
.legendbar .sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.footnote{text-align:center;font-size:12px;color:var(--mut);margin-top:20px;line-height:1.9}
svg text{font-family:inherit}

/* ---- entry form ---- */
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:5px}
.fld select,.fld input{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink)}
.fld select:focus,.fld input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:10px 22px;
  font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-dark)}
.btn-o{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.btn-o:hover{background:var(--tint)}
.btn-d{background:none;color:var(--crit);border:none;font-size:13px;cursor:pointer;font-family:inherit}
.taskinfo{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--good);color:#fff;
  padding:11px 26px;border-radius:12px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:99}

/* ---- analysis / report ---- */
.prow{display:flex;align-items:center;gap:12px;padding:7px 0}
.prow .pl{flex:0 0 160px;font-size:13.5px;font-weight:600;text-align:right}
.prow .pb{flex:1;height:18px;background:var(--tint2);border-radius:5px;position:relative}
.prow .pb .pf{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.prow .pv{flex:0 0 86px;font-size:14px;font-weight:800}
.repline{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.repline:last-child{border-bottom:none}
.repline .bullet{color:var(--blue);font-weight:800}
@media print{
  .side,.datechip,.backbtn,.seeall,.noprint,.histnote{display:none !important}
  .layout{display:block} .main{padding:0;max-width:none}
  body{background:#fff} html{background:#fff}
  .card,.kpi{box-shadow:none;border:1px solid #D8DEE6;break-inside:avoid}
}
.backbtn:focus-visible,.urow:focus-visible,.jobhead:focus-visible,.nitem:focus-visible,.lbtn:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
</style>

<div class="layout">

let DATA = MODEL.map(sec => ({...sec, units: sec.units.map(u => {
  const jobs = u.jobs.map(([jname, jmh], ji) => {
    const nT = 5 + Math.floor(rng()*6);
    const idx = Array.from({length:nT},(_,i)=>Math.round(i*(PHASES.length-1)/(nT-1)));
    const wsum = idx.reduce((s,i)=>s+PHASES[i][1],0);
    const jStart = 1 + Math.floor(rng()*6) + ji*4;
    const jEnd = Math.min(WEEKS, jStart + 16 + Math.floor(rng()*10));
    const span = jEnd - jStart;
    const tasks = idx.map((pi,ti)=>{
      const mh = Math.round(jmh*PHASES[pi][1]/wsum);
      const s = jStart + span*ti/nT, e = jStart + span*(ti+1)/nT + span*0.15;
      const lagT = u.lag + (rng()-0.5)*2;
      const plan = w => Math.max(0, Math.min(1,(w-s)/(e-s)));
      let act = Math.max(0, Math.min(1, plan(REALWK - lagT)));
      act = Math.round(act*20)/20;
      return {name:PHASES[pi][0], mh, s, e, plan, act};
    });
    if(jEnd <= REALWK+2 && u.lag <= 1.5){ tasks.forEach(t=>t.act=1); }
    return {name:jname, tasks, mh:tasks.reduce((a,t)=>a+t.mh,0)};
  });
  return {...u, jobs};
})}));

/* ---- ผลจริง ณ สัปดาห์ y้อนหลัง: สเกลตามรูปทรงแผน ---- */
function actAt(t,w){
  if(w>=REALWK) return t.act;
  const p0=t.plan(REALWK);
  if(p0<=0) return 0;
  return Math.min(t.act, t.act*Math.min(1, t.plan(w)/p0));
}
const sum = a => a.reduce((x,y)=>x+y,0);
function agg(tasks, w){ const mh=sum(tasks.map(t=>t.mh));
  return {mh, plan:sum(tasks.map(t=>t.mh*t.plan(w)))/mh*100, act:sum(tasks.map(t=>t.mh*actAt(t,w)))/mh*100,
          actMh:sum(tasks.map(t=>t.mh*actAt(t,w)))}; }
const unitTasks = u=>u.jobs.flatMap(j=>j.tasks),

/* ============ บันทึกข้อมูล ============ */
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function entryPage(){
  const todays=ENTRIES.filter(e=>e.date===todayISO()).length;
  const comp=complianceToday(), doneN=comp.filter(x=>x.done).length;
  const days=[...Array(7).keys()].map(i=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});
  // สรุปวินัยราย 7 วัน + จัดอันดับ "ต้องติดตาม"
  const stat=DATA.flatMap(s=>s.units).map(u=>{
    const marks=days.map(d=>unitsRecordedOn(dateISO(d)).has(u.code));
    const rec=marks.filter(Boolean).length;
    return {u, marks, rec, miss:7-rec, pct:Math.round(rec/7*100)};
  });
  const follow=stat.filter(x=>x.miss>0).sort((a,b)=>b.miss-a.miss);
  const followBox = `<div class="followbox">

function entryUnitChanged(){

  sel.innerHTML='<option value="">—</option>'+(u?u.jobs.map(j=>`<option value="${j.id}">${j.id} · ${j.name}</option>`).join(""):"");
  sel.disabled=!u;
  const ts=document.getElementById("fTask"); ts.innerHTML='<option value="">—</option>'; ts.disabled=true;
  document.getElementById("taskInfo").innerHTML="";
}
function entryJobChanged(){
  const jid=document.getElementById("fJob").value, sel=document.getElementById("fTask");
  const j=DATA.flatMap(s=>s.units).flatMap(u=>u.jobs).find(x=>x.id===jid);
  sel.innerHTML='<option value="">—</option>'+(j?j.tasks.map(t=>`<option value="${t.id}">${t.id} · ${t.name}</option>`).join(""):"");
  sel.disabled=!j;
  document.getElementById("taskInfo").innerHTML="";
}
function latestPctFor(tid){
  let last=null;
  ENTRIES.forEach(e=>{ if(e.taskId===tid && (!last || e.date>=last.date)) last=e; });
  return last ? last.pct : null;
}
function entryTaskChanged(){
  const tid=document.getElementById("fTask").value, x=TASK_INDEX[tid], inp=document.getElementById("fPct");
  const lastPct = tid ? latestPctFor(tid) : null;
  const floor = lastPct!=null ? lastPct : (x? Math.round(x.t.act*100) : 0);   // ห้ามต่ำกว่าค่านี้
  document.getElementById("taskInfo").innerHTML = x?
    `<div class="taskinfo num">📌 <b>${x.t.name}</b> · ${pk(["แผน","ແຜນ","plan"])} ${fmt0(x.t.mh)} man-hr · ${pk(["สัปดาห์","ສັບປະດາ","wk"])} ${Math.max(1,Math.round(x.t.s))}–${Math.min(WEEKS,Math.round(x.t.e))} ·
     ${pk(["% แผนตอนนี้","% ແຜນຕອນນີ້","plan now"])} <b>${fmt1(x.t.plan(REALWK)*100)}%</b> · ${pk(["% ปัจจุบัน","% ປັດຈຸບັນ","current"])} <b>${fmt1(x.t.act*100)}%</b>
     <br><span style="color:var(--warn)">🔒 ${pk(["กรอกได้ไม่ต่ำกว่า","ປ້ອນໄດ້ບໍ່ຕ່ຳກວ່າ","must be ≥"])} ${floor}% ${pk(["(ความคืบหน้าสะสม ห้ามถอยหลัง)","(ຄວາມຄືບໜ້າສະສົມ ຫ້າມຖອຍຫຼັງ)","(cumulative — cannot go backward)"])}</span></div>`:"";
  if(x){ inp.min=floor; inp.value=Math.max(floor, Math.round(x.t.act*100)); inp.dataset.floor=floor; }
}
function saveEntry(){
  const tid=document.getElementById("fTask").value;
  const pct=parseFloat(document.getElementById("fPct").value);
  if(!tid){ alert(pk(["กรุณาเลือกหน่วยงาน → Job → Task ให้ครบ","ກະລຸນາເລືອກໜ່ວຍງານ → Job → Task ໃຫ້ຄົບ","Please select Unit → Job → Task"])); return; }
  if(isNaN(pct)||pct<0||pct>100){ alert(pk(["กรุณากรอก % ระหว่าง 0–100","ກະລຸນາປ້ອນ % ລະຫວ່າງ 0–100","Enter % between 0–100"])); return; }
  const floor = latestPctFor(tid);
  if(floor!=null && pct<floor){ alert(pk(["ค่าความคืบหน้าสะสมต้องไม่น้อยกว่าค่าล่าสุด ("+floor+"%) — งานถอยหลังไม่ได้","ຄ່າຄວາມຄືບໜ້າສະສົມຕ້ອງບໍ່ໜ້ອຍກວ່າຄ່າຫຼ້າສຸດ ("+floor+"%)","Cumulative progress cannot be lower than the latest value ("+floor+"%)"])); return; }
  ENTRIES.push({date:todayISO(), taskId:tid, pct:pct,
    mh:parseFloat(document.getElementById("fMh").value)||0,
    by:document.getElementById("fBy").value.trim(),
    note:document.getElementById("fNote").value.trim()});
  saveEntries(ENTRIES); applyEntries(); entryPage();

  t.innerHTML=`<div class="toast">✓ ${pk(["บันทึกแล้ว — dashboard อัปเดตทันที","ບັນທຶກແລ້ວ — dashboard ອັບເດດທັນທີ","Saved — dashboard updated"])}</div>`;
  setTimeout(()=>{ t.innerHTML=""; },2500);
}
function delEntry(i){

      ${rows.map(r=>{const w=Math.abs(r.varc)/maxAbs*100;
        return `<div class="prow"><span class="pl">${un(r.u.name)}</span>
        <span class="pb"><span class="pf" style="width:${w}%;background:${SCc[r.st[1]]}"></span></span>
        <span class="pv num" style="color:${SCc[r.st[1]]}">${r.varc>=0?"+":"−"}${fmt1(Math.abs(r.varc))}</span></div>`;}).join("")}
    </div>
    <div class="card"><h2>🔻 ${pk(["Top 5 Job ที่ฉุดภาพรวม","Top 5 Job ທີ່ດຶງພາບລວມ","Top 5 dragging jobs"])}</h2>
      ${jobs.map((x,i)=>`<div class="repline"><span class="bullet num">${i+1}.</span>
        <div style="flex:1"><b style="cursor:pointer;color:var(--blue)" onclick='unitView("${DATA.find(s=>s.units.includes(x.u)).id}","${x.u.name}")'>${x.j.name}</b>
        <div class="small num">${un(x.u.name)} · ${fmt1(x.a.act)}% / ${fmt1(x.a.plan)}% · ${fmt0(x.a.mh)} man-hr</div></div>
        <b class="num" style="color:var(--crit)">−${fmt1(Math.abs(x.varc))}</b></div>`).join("")}
    </div>
  </div>
  <div class="card"><h2>⚖️ ${pk(["ภาระงานที่เหลือ แยกตามส่วนงาน","ພາລະວຽກທີ່ເຫຼືອ ແຍກຕາມພາກ","Remaining workload by section"])}</h2>
    ${DATA.map(s=>{const a=agg(secTasks(s),WNOW); const left=a.mh-a.actMh;
      const maxLeft=Math.max(...DATA.map(x=>{const b=agg(secTasks(x),WNOW);return b.mh-b.actMh;}),1);
      return `<div class="prow"><span class="pl">${un(s.name)}</span>
      <span class="pb"><span class="pf" style="width:${left/maxLeft*100}%;background:${s.color}"></span></span>
      <span class="pv num">${fmt0(left)} <span class="small">man-hr</span></span></div>`;}).join("")}
    <div class="small num" style="margin-top:8px">${pk(["รวมคงเหลือ","ລວມເຫຼືອ","Total remaining"])} ${fmt0(f.mh-f.actMh)} man-hr · ${fmt0((f.mh-f.actMh)/wkLeft)} man-hr/${pk(["สัปดาห์","ສັບປະດາ","week"])}</div>
  </div>`;
}

/* ============ รายงาน ============ */
function repPage(){
  const f=agg(allTasks,WNOW), gap=f.act-f.plan, [fLbl]=statusOf(gap);
  const SCc={good:"#16A34A",warn:"#D97706",crit:"#EF4444"};
  const rows=riskRows();
  const late=rows.filter(r=>r.st[1]==="crit"), risk=rows.filter(r=>r.st[1]==="warn");
  const jobsAll=DATA.flatMap(s=>s.units.flatMap(u=>u.jobs.map(j=>({u,j,a:agg(j.tasks,WNOW)}))));
  const done=jobsAll.filter(x=>x.a.act>=99.5);
  const dueSoon=DATA.flatMap(s=>s.units.flatMap(u=>u.jobs.flatMap(j=>j.tasks.filter(t=>t.e<=WNOW+2&&actAt(t,WNOW)<1).map(t=>({u,j,t})))))
    .sort((a,b)=>a.t.e-b.t.e).slice(0,8);
  const PTS=pk(["จุด","ຈຸດ","pts"]);
  app.innerHTML = pagehead(pk(["รายงานประจำสัปดาห์ที่","ລາຍງານປະຈຳສັບປະດາທີ","Weekly Report — Week"])+" "+WNOW,
    pk(["สรุปสำหรับที่ประชุมผู้บริหาร · ข้อมูล ณ","ສະຫຼຸບສຳລັບກອງປະຊຸມຜູ້ບໍລິຫານ · ຂໍ້ມູນ ນະ","Executive summary · as of"])+" "+fmtDate(wkEnd(WNOW))) + `
  <div class="noprint" style="margin-bottom:14px"><button class="btn btn-p" onclick="window.print()">🖨 ${pk(["พิมพ์ / บันทึก PDF","ພິມ / ບັນທຶກ PDF","Print / Save PDF"])}</button></div>
  <div class="card"><h2>1. ${pk(["สรุปภาพรวม","ສະຫຼຸບພາບລວມ","Summary"])}</h2>
    <div class="repline"><span class="bullet">•</span><span class="num">${pk(["ความคืบหน้ารวม","ຄວາມຄືບໜ້າລວມ","Overall progress"])} <b>${fmt1(f.act)}%</b> ${pk(["เทียบแผน","ທຽບແຜນ","vs plan"])} ${fmt1(f.plan)}% — <b>${gap>=0?pk(["นำแผน","ນຳແຜນ","ahead"]):pk(["ช้ากว่าแผน","ຊ້າກວ່າແຜນ","behind"])} ${fmt1(Math.abs(gap))} ${PTS} (${fLbl})</b></span></div>
    <div class="repline"><span class="bullet">•</span><span class="num">${pk(["แรงงานสะสม","ແຮງງານສະສົມ","Man-hours"])} <b>${fmt0(f.actMh)}</b> / ${fmt0(f.mh)} man-hr · Job ${pk(["เสร็จ","ສຳເລັດ","done"])} <b>${done.length}/${jobsAll.length}</b></span></div>
    <div class="repline"><span class="bullet">•</span><span class="num">${pk(["หน่วยล่าช้า","ໜ່ວຍຊັກຊ້າ","Late units"])} <b style="color:var(--crit)">${late.length}</b> · ${pk(["เสี่ยง","ສ່ຽງ","at-risk"])} <b style="color:var(--warn)">${risk.length}</b> / 9 · ${pk(["เหลือ","ເຫຼືອ","remaining"])} <b>${WEEKS-WNOW} ${pk(["สัปดาห์","ສັບປະດາ","weeks"])}</b></span></div>
  </div>
  <div class="card"><h2>2. ${pk(["สถานะรายหน่วยงาน","ສະຖານະລາຍໜ່ວຍງານ","Status by unit"])}</h2>
    <div class="scrollx"><table>
      <tr><th>${pk(["หน่วยงาน","ໜ່ວຍງານ","Unit"])}</th><th class="r">${pk(["แผน","ແຜນ","Plan"])}</th><th class="r">${pk(["ผลจริง","ຜົນຕົວຈິງ","Actual"])}</th><th class="r">${pk(["ผลต่าง","ຜົນຕ່າງ","Var"])}</th><th>${pk(["สถานะ","ສະຖານະ","Status"])}</th><th>${pk(["ผู้รับผิดชอบ","ຜູ້ຮັບຜິດຊອບ","Owner"])}</th></tr>
      ${rows.sort((a,b)=>a.varc-b.varc).map(r=>`<tr>
        <td><b>${un(r.u.name)}</b></td>
        <td class="r num">${fmt1(r.a.plan)}%</td><td class="r num"><b>${fmt1(r.a.act)}%</b></td>
        <td class="r num" style="color:${SCc[r.st[1]]};font-weight:700">${r.varc>=0?"+":"−"}${fmt1(Math.abs(r.varc))}</td>
        <td><span class="chip c-${r.st[1]}">${r.st[0]}</span></td><td class="small">${r.u.owner}</td></tr>`).join("")}
    </table></div></div>
  <div class="card"><h2>3. ${pk(["ประเด็นสั่งการ","ປະເດັນສັ່ງການ","Action items"])}</h2>
    ${[...late,...risk].sort((a,b)=>a.varc-b.varc).map((r,i)=>`<div class="repline"><span class="bullet num">${i+1}.</span>
      <span><b>${un(r.u.name)}</b> ${r.st[0]} ${fmt1(Math.abs(r.varc))} ${PTS} — ${pk(["มอบ","ມອບ","assign"])} ${r.u.owner} ${pk(["เสนอแผนเร่งรัด (เพิ่มแรงงาน/OT/จ้างเหมา) ภายในสัปดาห์นี้","ສະເໜີແຜນເລັ່ງລັດ (ເພີ່ມແຮງງານ/OT/ຈ້າງເໝົາ) ພາຍໃນສັບປະດານີ້","to propose a recovery plan (crew/OT/subcontract) this week"])}</span></div>`).join("")
      ||`<div class="small">${pk(["ไม่มีหน่วยงานล่าช้าหรือเสี่ยง","ບໍ່ມີໜ່ວຍງານຊັກຊ້າ ຫຼື ສ່ຽງ","No late or at-risk units"])}</div>`}
  </div>
  <div class="grid2">
    <div class="card"><h2>4. ${pk(["Job ที่เสร็จสมบูรณ์","Job ທີ່ສຳເລັດ","Completed jobs"])} (${done.length})</h2>
      ${done.length? done.map(x=>`<div class="repline"><span class="bullet">✓</span><span>${x.j.name} <span class="small">· ${un(x.u.name)}</span></span></div>`).join("")
        :`<div class="small">${pk(["ยังไม่มี Job ที่ปิดครบทุก Task","ຍັງບໍ່ມີ Job ທີ່ປິດຄົບທຸກ Task","No fully closed jobs yet"])}</div>`}
    </div>
    <div class="card"><h2>5. ${pk(["Task ครบกำหนดใน 2 สัปดาห์","Task ຄົບກຳນົດໃນ 2 ສັບປະດາ","Tasks due within 2 weeks"])}</h2>
      ${dueSoon.length? dueSoon.map(x=>`<div class="repline"><span class="bullet num">W${Math.min(WEEKS,Math.round(x.t.e))}</span>
        <span>${x.t.name} <span class="small">· ${x.j.name} · ${un(x.u.name)} · ${fmt1(actAt(x.t,WNOW)*100)}%</span></span></div>`).join("")
        :`<div class="small">${pk(["ไม่มี Task ใกล้ครบกำหนด","ບໍ່ມີ Task ໃກ້ຄົບກຳນົດ","None due soon"])}</div>`}
    </div>
  </div>
  <div class="card"><h2>6. ${pk(["วินัยการบันทึกข้อมูลรายวัน (7 วันล่าสุด)","ວິໄນການບັນທຶກຂໍ້ມູນລາຍວັນ (7 ວັນຫຼ້າສຸດ)","Daily entry compliance (last 7 days)"])}</h2>
    ${(function(){
      const days7=[...Array(7).keys()].map(i=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});
      const rows7=DATA.flatMap(s=>s.units).map(u=>{
        const n=days7.filter(d=>unitsRecordedOn(dateISO(d)).has(u.code)).length;
        return {u,n,pct:Math.round(n/7*100)};
      }).sort((a,b)=>a.pct-b.pct);
      const missToday=complianceToday().filter(x=>!x.done);
      return (missToday.length? `<div class="repline"><span class="bullet" style="color:var(--crit)">⚠</span>
        <span><b>${pk(["วันนี้ยังไม่บันทึก:","ມື້ນີ້ຍັງບໍ່ບັນທຶກ:","Not recorded today:"])}</b> ${missToday.map(x=>un(x.u.name)+" ("+x.u.owner+")").join(" · ")}</span></div>`:
        `<div class="repline"><span class="bullet" style="color:var(--good)">✓</span><span>${pk(["วันนี้บันทึกครบทั้ง 9 หน่วย","ມື້ນີ້ບັນທຶກຄົບ 9 ໜ່ວຍ","All 9 units recorded today"])}</span></div>`)
      + rows7.map(x=>`<div class="repline"><span class="bullet num" style="color:${x.pct>=80?'var(--good)':x.pct>=50?'var(--warn)':'var(--crit)'}">${x.pct}%</span>
        <span>${un(x.u.name)} <span class="small">· ${x.n}/7 ${pk(["วัน","ວັນ","days"])} · ${x.u.owner}</span></span></div>`).join("");
    })()}
  </div>`;
}

renderLang(); renderNav(); overview();
</script>
