function xlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function xlC(v,t,st){ const s=st?` ss:StyleID="${st}"`:""; return `<Cell${s}><Data ss:Type="${t}">${xlEsc(v)}</Data></Cell>`; }
function xlS(v,st){ return xlC(v,"String",st); }
function xlN(v,st){ return xlC(v,"Number",st); }
function xlRow(cells){ return `<Row>${cells}</Row>`; }
function exportExcel(){
  const SC={good:"stGood",warn:"stWarn",crit:"stCrit"};
  // ---- ชีตสรุปทั้งโรงงาน ----
  let sumRows = xlRow(xlS(pk(["สรุปงานซ่อมทั้งโรงงาน · ณ สัปดาห์ "+WNOW+" ("+ (function(){const d=wkEnd(WNOW);return d.getDate()+"/"+(d.getMonth()+1)+"/"+ (LANG==="th"?d.getFullYear()+543:d.getFullYear());})() +")","ສະຫຼຸບ","Factory summary"]),"title"));
  sumRows += xlRow(["ส่วนงาน","หน่วยงาน","ผู้รับผิดชอบ","% แผนสะสม","% ผลจริง","ผลต่าง(จุด)","สถานะ","แรง แผน","แรง ทำได้","Job เสร็จ/ทั้งหมด"].map(h=>xlS(h,"hdr")).join(""));
  DATA.forEach(s=>s.units.forEach(u=>{
    const a=agg(unitTasks(u),WNOW), v=a.act-a.plan, st=statusOf(v);
    const jobs=u.jobs, done=jobs.filter(j=>agg(j.tasks,WNOW).act>=99.5).length;
    sumRows += xlRow(
      xlS(un(s.name))+xlS(un(u.name))+xlS(u.owner)+
      xlN(+a.plan.toFixed(1),"pct")+xlN(+a.act.toFixed(1),"pct")+xlN(+v.toFixed(1),"pct")+
      xlS(st[0],SC[st[1]])+xlN(Math.round(a.mh))+xlN(Math.round(a.actMh))+xlS(done+"/"+jobs.length)
    );
  }));
  const f=agg(allTasks,WNOW);
  sumRows += xlRow(xlS("รวมทั้งโรงงาน","sec")+xlS("","sec")+xlS("","sec")+xlN(+f.plan.toFixed(1),"secp")+xlN(+f.act.toFixed(1),"secp")+xlN(+(f.act-f.plan).toFixed(1),"secp")+xlS("","sec")+xlN(Math.round(f.mh),"sec")+xlN(Math.round(f.actMh),"sec")+xlS("","sec"));
  let sheets = `<Worksheet ss:Name="สรุปทั้งโรงงาน"><Table>${sumRows}</Table></Worksheet>`;
  // ---- ชีตละแผนก ----
  DATA.forEach(s=>s.units.forEach(u=>{
    const a=agg(unitTasks(u),WNOW), v=a.act-a.plan, st=statusOf(v);
    let rows = xlRow(xlS(un(u.name)+" · "+un(s.name)+" · "+u.owner,"title"));
    rows += xlRow(xlS(pk(["ความคืบหน้ารวม","ຄວາມຄືບໜ້າ","Progress"],0)+" "+fmt1(a.act)+"% / "+pk(["แผน","ແຜນ","plan"],0)+" "+fmt1(a.plan)+"% · "+st[0],"sub"));
    rows += xlRow(["รหัส Job","ชื่อ Job","รหัส Task","ชื่อ Task","น้ำหนัก (แต้ม)","แต้มที่ทำได้","แรง","สัปดาห์เริ่ม","สัปดาห์เสร็จ","% แผน","% ผลจริง","สถานะ","บันทึกล่าสุด","ผู้บันทึกล่าสุด"].map(h=>xlS(h,"hdr")).join(""));
    if(u.blank){ rows += xlRow(xlS(pk(["ยังไม่มีแผน Job/Task — รอนำเข้าข้อมูลจริง (คงเส้นแผน %/แรงระดับหน่วยตามไฟล์เป้าหมาย)","ຍັງບໍ່ມີແຜນ Job/Task","No Job/Task plan yet — awaiting real data"],0),"sub")); }
    visJobs(u).forEach(j=>{
      const ja=agg(j.tasks,WNOW), jv=ja.act-ja.plan, jst=statusOf(jv);
      const jwt=+j.tasks.reduce((s,t)=>s+t.wt,0).toFixed(2), jpts=+j.tasks.reduce((s,t)=>s+actAt(t,WNOW)*t.wt,0).toFixed(2);
      rows += xlRow(xlS(j.id,"sec")+xlS(tr(j.name),"sec")+xlS("","sec")+xlS(pk(["(รวมงาน)","(ລວມ)","(job total)"],0),"sec")+xlN(jwt,"sec")+xlN(jpts,"sec")+xlN(Math.round(ja.mh),"sec")+xlS("","sec")+xlS("","sec")+xlN(+ja.plan.toFixed(1),"secp")+xlN(+ja.act.toFixed(1),"secp")+xlS(jst[0],"sec")+xlS("","sec")+xlS("","sec"));
      j.tasks.forEach(t=>{
        const tp=t.plan(WNOW)*100, ta=actAt(t,WNOW)*100, tst= ta>=100?["เสร็จ","good"]:statusOf(ta-tp);
        const le=latestEntryFor(t.id);
        rows += xlRow(
          xlS(j.id)+xlS(tr(j.name))+xlS(t.id)+xlS(tr(t.name))+xlN(t.wt)+xlN(+(actAt(t,WNOW)*t.wt).toFixed(2))+xlN(Math.round(t.mh))+
          xlN(Math.max(1,Math.round(t.s)))+xlN(Math.min(WEEKS,Math.round(t.e)))+
          xlN(+tp.toFixed(1),"pct")+xlN(+ta.toFixed(1),"pct")+xlS(tst[0],SC[tst[1]])+
          xlS(le?le.date:"")+xlS(le?le.by:"")
        );
      });
    });
    sheets += `<Worksheet ss:Name="${xlEsc(un(u.name).slice(0,31))}"><Table>${rows}</Table></Worksheet>`;
  }));
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel">
<Styles>
 <Style ss:ID="Default"><Alignment ss:Vertical="Center"/><Font ss:FontName="Tahoma" ss:Size="10"/></Style>
 <Style ss:ID="title"><Font ss:Bold="1" ss:Size="13" ss:Color="#1D4ED8"/></Style>
 <Style ss:ID="sub"><Font ss:Italic="1" ss:Color="#555555"/></Style>
 <Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#2563EB" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
 <Style ss:ID="sec"><Font ss:Bold="1"/><Interior ss:Color="#E3EDFC" ss:Pattern="Solid"/></Style>
 <Style ss:ID="secp"><Font ss:Bold="1"/><Interior ss:Color="#E3EDFC" ss:Pattern="Solid"/><NumberFormat ss:Format="0.0"/></Style>
 <Style ss:ID="pct"><NumberFormat ss:Format="0.0"/></Style>
 <Style ss:ID="stGood"><Font ss:Color="#16A34A" ss:Bold="1"/></Style>
 <Style ss:ID="stWarn"><Font ss:Color="#D97706" ss:Bold="1"/></Style>
 <Style ss:ID="stCrit"><Font ss:Color="#DC2626" ss:Bold="1"/></Style>
</Styles>
${sheets}
</Workbook>`;
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([xml],{type:"application/vnd.ms-excel;charset=utf-8"}));
    a.download="iDash_MaintTrack_"+todayISO()+".xls"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); },100);
  }catch(err){ alert("Export error: "+err.message); }
}

    + (nRep<nAll ? " · "+pk(["เฉพาะ "+nRep+"/"+nAll+" หน่วยที่รายงานแล้ว","ສະເພາະ "+nRep+"/"+nAll+" ໜ່ວຍ","only "+nRep+"/"+nAll+" units reported"]) : "")) + `

    <div class="kpi"><div class="label">${pk(["ความเร็วที่ต้องทำ","ຄວາມໄວທີ່ຕ້ອງເຮັດ","Required pace"])}</div>
      <div class="value num" style="font-size:30px;color:${paceNeed>paceNow?'var(--warn)':'var(--good)'}">${fmt1(paceNeed)}<span class="unit">${WKU}</span></div>
      <div class="note num">${pk(["เพื่อครบ 100% (ต้องเร่งขึ้น","ເພື່ອຄົບ 100% (ຕ້ອງເລັ່ງຂຶ້ນ","for 100% (speed up"])} ${fmt1(Math.max(0,(paceNeed/Math.max(paceNow,.01)-1)*100))}%)</div></div>
    <div class="kpi"><div class="label">${pk(["คาดการณ์ ณ วันเปิดหีบ","ຄາດຄະເນ ນະວັນເປີດຫີບ","Forecast at start"])}</div>
      <div class="value num" style="font-size:30px;color:${forecast>=99.5?'var(--good)':'var(--crit)'}">${fmt1(forecast)}<span class="unit">%</span></div>

  ${(function(){

    else { verdict=pk(["เสี่ยงไม่ทันเป้า ต้องเร่งด่วน","ສ່ຽງບໍ່ທັນເປົ້າ ຕ້ອງເລັ່ງດ່ວນ","At risk of missing — act now"]); vcolor="var(--crit)"; vbg="var(--crit-bg)"; vicon="⛔";
      vmsg=pk(["ด้วยความเร็วปัจจุบันจะจบเพียง "+fmt1(forecast)+"% ต่ำกว่าเป้า 100%","ດ້ວຍຄວາມໄວປັດຈຸບັນຈະຈົບພຽງ "+fmt1(forecast)+"%","At the current pace you will only reach "+fmt1(forecast)+"%"]); }
    const needMh=(f.mh-f.actMh), needMhWk=needMh/wkLeft, haveMhWk=f.actMh/WNOW;

        <span>${pk(["เป้า","ເປົ້າ","target"])} 100% · ${fmtDate(SEASON_END)}</span></div>

  <div class="grid2">

      ${rows.map(r=>{const w=Math.abs(r.varc)/maxAbs*100;

        <b class="num" style="color:var(--crit)">−${fmt1(Math.abs(x.varc))}</b></div>`).join("")}
    </div>
  </div>
  <div class="card"><h2>⚖️ ${pk(["ภาระงานที่เหลือ แยกตามส่วนงาน","ພາລະວຽກທີ່ເຫຼືອ ແຍກຕາມພາກ","Remaining workload by section"])}</h2>
    ${DATA.map(s=>{const a=agg(secTasks(s),WNOW); const left=a.mh-a.actMh;
      const maxLeft=Math.max(...DATA.map(x=>{const b=agg(secTasks(x),WNOW);return b.mh-b.actMh;}),1);
      return `<div class="prow"><span class="pl">${un(s.name)}</span>
      <span class="pb"><span class="pf" style="width:${left/maxLeft*100}%;background:${s.color}"></span></span>

    <div class="small num" style="margin-top:8px">${pk(["รวมคงเหลือ","ລວມເຫຼືອ","Total remaining"])} ${fmt0(f.mh-f.actMh)} ${pk(["แรง","ແຮງ","man-days"])} · ${fmt0((f.mh-f.actMh)/wkLeft)} ${pk(["แรง","ແຮງ","man-days"])}/${pk(["สัปดาห์","ສັບປະດາ","week"])}</div>
  </div>`;
}

  app.innerHTML = pagehead(pk(["รายงานประจำสัปดาห์ที่","ລາຍງານປະຈຳສັບປະດາທີ","Weekly Report — Week"])+" "+WNOW,
    pk(["สรุปสำหรับที่ประชุมผู้บริหาร · ข้อมูล ณ","ສະຫຼຸບສຳລັບກອງປະຊຸມຜູ້ບໍລິຫານ · ຂໍ້ມູນ ນະ","Executive summary · as of"])+" "+fmtDate(wkEnd(WNOW))) + `
  <div class="noprint" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn btn-p" onclick="window.print()">🖨 ${pk(["พิมพ์ / บันทึก PDF","ພິມ / ບັນທຶກ PDF","Print / Save PDF"])}</button>
    <button class="btn btn-o" onclick="exportExcel()">📊 Export Excel</button>
    <button class="btn" onclick="go('over')" style="margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:500;padding:9px 18px">← ${pk(["กลับ","ກັບ","Back"])}</button></div>
  <div class="card"><h2>1. ${pk(["สรุปภาพรวม","ສະຫຼຸບພາບລວມ","Summary"])}</h2>
    <div class="repline"><span class="bullet">•</span><span class="num">${pk(["ความคืบหน้ารวม","ຄວາມຄືບໜ້າລວມ","Overall progress"])} <b>${fmt1(f.act)}%</b> ${pk(["เทียบแผน","ທຽບແຜນ","vs plan"])} ${fmt1(f.plan)}% — <b>${gap>=0?pk(["นำแผน","ນຳແຜນ","ahead"]):pk(["ช้ากว่าแผน","ຊ້າກວ່າແຜນ","behind"])} ${fmt1(Math.abs(gap))} ${PTS} (${fLbl})</b></span></div>
    <div class="repline"><span class="bullet">•</span><span class="num">${pk(["แรงงานสะสม","ແຮງງານສະສົມ","Man-days"])} <b>${fmt0(f.actMh)}</b> / ${fmt0(SEASON_FORCE)} ${pk(["แรง","ແຮງ","man-days"])} · Job ${pk(["เสร็จ","ສຳເລັດ","done"])} <b>${done.length}/${jobsAll.length}</b></span></div>
    <div class="repline"><span class="bullet">•</span><span class="num">${pk(["หน่วยล่าช้า","ໜ່ວຍຊັກຊ້າ","Late units"])} <b style="color:var(--crit)">${late.length}</b> · ${pk(["เสี่ยง","ສ່ຽງ","at-risk"])} <b style="color:var(--warn)">${risk.length}</b> / 9 · ${pk(["เหลือ","ເຫຼືອ","remaining"])} <b>${WEEKS-WNOW} ${pk(["สัปดาห์","ສັບປະດາ","weeks"])}</b></span></div>
  </div>
  <div class="card"><h2>2. ${pk(["สถานะรายหน่วยงาน","ສະຖານະລາຍໜ່ວຍງານ","Status by unit"])}</h2>
    <div class="scrollx"><table>
      <tr><th>${pk(["หน่วยงาน","ໜ່ວຍງານ","Unit"])}</th><th class="r">${pk(["แผน","ແຜນ","Plan"])}</th><th class="r">${pk(["ผลจริง","ຜົນຕົວຈິງ","Actual"])}</th><th class="r">${pk(["ผลต่าง","ຜົນຕ່າງ","Var"])}</th><th>${pk(["สถานะ","ສະຖານະ","Status"])}</th><th>${pk(["ผู้รับผิดชอบ","ຜູ້ຮັບຜິດຊອບ","Owner"])}</th></tr>
      ${rows.sort((a,b)=>a.varc-b.varc).map(r=>`<tr>
        <td><b>${un(r.u.name)}</b></td>
        <td class="r num">${fmt1(r.a.plan)}%</td><td class="r num"><b>${fmt1(r.a.act)}%</b></td>
        <td class="r num" style="color:${SCc[r.st[1]]};font-weight:700">${r.varc>=0?"+":"−"}${fmt1(Math.abs(r.varc))}</td>
        <td><span class="chip c-${r.st[1]}">${r.st[0]}</span></td><td class="small">${r.u.owner}</td></tr>`).join("")}
    </table></div></div>
  <div class="card"><h2>3. ${pk(["ประเด็นสั่งการ","ປະເດັນສັ່ງການ","Action items"])}</h2>
    ${[...late,...risk].sort((a,b)=>a.varc-b.varc).map((r,i)=>`<div class="repline"><span class="bullet num">${i+1}.</span>
      <span><b>${un(r.u.name)}</b> ${r.st[0]} ${fmt1(Math.abs(r.varc))} ${PTS} — ${pk(["มอบ","ມອບ","assign"])} ${r.u.owner} ${pk(["เสนอแผนเร่งรัด (เพิ่มแรงงาน/OT/จ้างเหมา) ภายในสัปดาห์นี้","ສະເໜີແຜນເລັ່ງລັດ (ເພີ່ມແຮງງານ/OT/ຈ້າງເໝົາ) ພາຍໃນສັບປະດານີ້","to propose a recovery plan (crew/OT/subcontract) this week"])}</span></div>`).join("")
      ||`<div class="small">${pk(["ไม่มีหน่วยงานล่าช้าหรือเสี่ยง","ບໍ່ມີໜ່ວຍງານຊັກຊ້າ ຫຼື ສ່ຽງ","No late or at-risk units"])}</div>`}
  </div>
  <div class="grid2">
    <div class="card"><h2>4. ${pk(["Job ที่เสร็จสมบูรณ์","Job ທີ່ສຳເລັດ","Completed jobs"])} (${done.length})</h2>
      ${done.length? done.map(x=>`<div class="repline"><span class="bullet">✓</span><span>${tr(x.j.name)} <span class="small">· ${un(x.u.name)}</span></span></div>`).join("")
        :`<div class="small">${pk(["ยังไม่มี Job ที่ปิดครบทุก Task","ຍັງບໍ່ມີ Job ທີ່ປິດຄົບທຸກ Task","No fully closed jobs yet"])}</div>`}
    </div>
    <div class="card"><h2>5. ${pk(["Task ครบกำหนดใน 2 สัปดาห์","Task ຄົບກຳນົດໃນ 2 ສັບປະດາ","Tasks due within 2 weeks"])}</h2>
      ${dueSoon.length? dueSoon.map(x=>`<div class="repline"><span class="bullet num">W${Math.min(WEEKS,Math.round(x.t.e))}</span>
        <span>${tr(x.t.name)} <span class="small">· ${tr(x.j.name)} · ${un(x.u.name)} · ${fmt1(actAt(x.t,WNOW)*100)}%</span></span></div>`).join("")
        :`<div class="small">${pk(["ไม่มี Task ใกล้ครบกำหนด","ບໍ່ມີ Task ໃກ້ຄົບກຳນົດ","None due soon"])}</div>`}
    </div>
  </div>
  <div class="card"><h2>6. ${pk(["ตารางเช็คการบันทึกรายสัปดาห์ (update ทุกวันเสาร์)","ຕາຕະລາງກວດການບັນທຶກລາຍອາທິດ","Weekly entry attendance (update every Saturday)"])}</h2>
    <div class="sub">${pk(["✓ บันทึกแล้ว · ✗ ยังไม่บันทึก · — ยังไม่มีแผน/ยังไม่เริ่มงาน · คอลัมน์ฟ้า = สัปดาห์ปัจจุบัน","✓ ບັນທຶກແລ້ວ · ✗ ຍັງບໍ່ບັນທຶກ · — ຍັງບໍ່ມີແຜນ","✓ recorded · ✗ not yet · — no plan/not started · blue col = current week"])}</div>
    ${(function(){
      const N=Math.min(WNOW,10);
      const wks=[...Array(N).keys()].map(i=>WNOW-N+1+i);
      const recWk={};   // code -> Set(สัปดาห์ที่บันทึก)
      ENTRIES.forEach(e=>{ const w=seasonWeekOf(e.date); if(w>0 && (w<=BASELINE_WK || !isImportEntry(e))){ const c=e.taskId.split("-")[0]; (recWk[c]=recWk[c]||new Set()).add(w);} });
      const units=DATA.flatMap(s=>s.units);
      const th=wks.map(w=>`<th class="r ${w===WNOW?'wkcur':''}" title="${fmtDate(wkStart(w))}–${fmtDate(wkEnd(w))}">W${w}<br><span class="small num" style="font-weight:400">${wkEnd(w).getDate()}/${wkEnd(w).getMonth()+1}</span></th>`).join("");
      const rows=units.map(u=>{
        const set=recWk[u.code]||new Set();
        const startW=u.blank?999:Math.min(...unitTasks(u).filter(t=>!t.placeholder).map(t=>Math.ceil(t.s)),999);
        let done=0, due=0;
        const cells=wks.map(w=>{
          if(u.blank || w<startW) return `<td class="r ${w===WNOW?'wkcur':''}" style="color:var(--mut)">—</td>`;
          due++;
          /* สัปดาห์ ≤ 18 นำเข้าข้อมูลย้อนหลังแล้ว ถือว่าบันทึกครบ · สัปดาห์ 19+ เช็คการบันทึกจริง */
          const rec = (w<=BASELINE_WK) ? true : set.has(w);
          if(rec) done++;
          return `<td class="r ${w===WNOW?'wkcur':''}" style="color:${rec?'var(--good)':'var(--crit)'};font-weight:800">${rec?'✓':'✗'}</td>`;
        }).join("");
        const sum=u.blank?`<span style="color:var(--mut)">${pk(["รอแผน","ລໍຖ້າ","—"])}</span>`:`${done}/${due}`;
        return `<tr><td style="white-space:nowrap"><b>${un(u.name)}</b><div class="small">${u.owner}</div></td>${cells}<td class="r num">${sum}</td></tr>`;
      }).join("");
      const missWk=complianceToday().filter(x=>!x.done);
      const banner=missWk.length
        ? `<div class="compbanner" style="margin:12px 0 0">⚠️ <b>${pk(["สัปดาห์ที่","ອາທິດທີ","Week"])} ${WNOW} ยังไม่บันทึก:</b> <span class="cbunits">${missWk.map(x=>un(x.u.name)).join(" · ")}</span> — ${pk(["update ภายในเสาร์","ອັບເດດພາຍໃນວັນເສົາ","update by Sat"])} ${fmtDate(weekSaturday(WNOW))}</div>`
        : `<div class="repline" style="margin-top:12px"><span class="bullet" style="color:var(--good)">✓</span><span>${pk(["สัปดาห์ที่","ອາທິດທີ","Week"])} ${WNOW} ${pk(["บันทึกครบทุกหน่วยที่มีแผนแล้ว","ບັນທຶກຄົບແລ້ວ","all active units recorded"])}</span></div>`;
      return `<div class="scrollx"><table class="attend">
        <tr><th style="text-align:left">${pk(["แผนก","ໜ່ວຍ","Unit"])}</th>${th}<th class="r">${pk(["รวม","ລວມ","Total"])}</th></tr>
        ${rows}</table></div>${banner}`;
    })()}
  </div>
  <div class="card"><h2>7. ${pk(["Audit ตรวจการกรอกผลงาน","Audit ກວດການປ້ອນຜົນງານ","Audit — entry verification"])} <span class="thin">· ${pk(["สัปดาห์ที่","ອາທິດທີ","Week"])} ${WNOW}</span></h2>
    <div class="sub">${pk(["ตรวจว่า % ที่แต่ละแผนกกรอกในสัปดาห์นี้ ถึงเป้าหมายของสัปดาห์ที่ "+WNOW+" หรือไม่ · แสดงเฉพาะ Task ที่มีการบันทึกในสัปดาห์นี้ (แยกส่วน → แผนก → Job)","ກວດ % ທີ່ປ້ອນທຽບເປົ້າອາທິດ "+WNOW,"Checks entered cumulative % against the week "+WNOW+" target · only tasks recorded this week"])}</div>
    ${(function(){
      if(WNOW<19) return `<div class="small" style="padding:10px 0;color:var(--mut)">${pk(["Audit เริ่มที่สัปดาห์ 19 (สัปดาห์ ≤18 เป็นข้อมูลนำเข้าย้อนหลัง)","Audit ເລີ່ມອາທິດ 19","Audit starts at week 19"])}</div>`;
      let nTask=0,nOk=0,nLow=0,nKeep=0;
      const secBlocks=DATA.map(sec=>{
        const unitBlocks=sec.units.map(u=>{
          const jobBlocks=visJobs(u).map(j=>{
            const trows=j.tasks.filter(t=>!t.placeholder).map(t=>{
              const e=taskWeekEntry(t.id,WNOW); if(!e) return "";
              const wt=t.wt||1, cur=e.pct/wt*100, prev=taskPrevPct(t.id,WNOW,wt), tgt=t.plan(WNOW)*100;
              const inc=cur-prev, dvar=cur-tgt, ok=cur>=tgt-0.05, keep=isKeepEntry(e);
              nTask++; if(ok) nOk++; else nLow++; if(keep) nKeep++;
              return `<tr>
                <td>${tr(t.name)}${keep?` <span class="tagkeep">${pk(["คงเดิม","ຄົງ","kept"])}</span>`:""}</td>
                <td class="r num">${fmt1(prev)}%</td>
                <td class="r num"><b>${fmt1(cur)}%</b></td>
                <td class="r num" style="color:${inc>0.05?'var(--good)':'var(--mut)'}">${inc>0.05?"+"+fmt1(inc):"—"}</td>
                <td class="r num">${fmt1(tgt)}%</td>
                <td class="r num" style="color:${ok?'var(--good)':'var(--crit)'};font-weight:700">${dvar>=0?"+":"−"}${fmt1(Math.abs(dvar))}</td>
                <td><span class="chip c-${ok?'good':'crit'}">${ok?pk(["ตามแผน","ຕາມແຜນ","on plan"]):pk(["ต่ำกว่าเป้า","ຕ່ຳກວ່າ","below"])}</span></td>
                <td class="small">${e.by||"—"}</td></tr>`;
            }).join("");
            if(!trows) return "";
            return `<div class="auditjob"><div class="auditjobname">📋 ${tr(j.name)}</div>
              <div class="scrollx"><table class="audittbl">
                <tr><th style="text-align:left">Task</th><th class="r">${pk(["ค่าเดิม","ຄ່າເດີມ","prev"])}</th><th class="r">${pk(["กรอกสัปดาห์นี้","ປ້ອນອາທິດນີ້","entered"])}</th><th class="r">${pk(["เพิ่ม","ເພີ່ມ","+"])}</th><th class="r">${pk(["เป้า W","ເປົ້າ W","target W"])}${WNOW}</th><th class="r">${pk(["ผลต่าง","ຜົນຕ່າງ","var"])}</th><th>${pk(["สถานะ","ສະຖານະ","status"])}</th><th>${pk(["ผู้บันทึก","ຜູ້ບັນທຶກ","by"])}</th></tr>
                ${trows}</table></div></div>`;
          }).join("");
          if(!jobBlocks) return "";
          return `<div class="auditunit"><div class="auditunitname">🔧 ${pk(["แผนก","ໜ່ວຍ","Unit"])} ${un(u.name)} <span class="small">· ${u.owner}</span></div>${jobBlocks}</div>`;
        }).join("");
        if(!unitBlocks) return "";
        return `<div class="auditsec"><div class="auditsecname"><span class="swatch" style="background:${sec.color}"></span>${pk(["ส่วน","ພາກ","Section"])} ${un(sec.name)}</div>${unitBlocks}</div>`;
      }).join("");
      if(!nTask) return `<div class="small" style="padding:10px 0;color:var(--mut)">${pk(["ยังไม่มีแผนกใดกรอก Progress ของสัปดาห์ "+WNOW+" — เมื่อมีการบันทึก รายการจะปรากฏที่นี่เพื่อตรวจเทียบเป้า","ຍັງບໍ່ມີການປ້ອນຂອງອາທິດ "+WNOW,"No entries for week "+WNOW+" yet — records will appear here for audit"])}</div>`;
      const head=`<div class="auditsum"><span class="asum-i">📝 ${pk(["กรอกแล้ว","ປ້ອນແລ້ວ","entered"])} <b class="num">${nTask}</b> task</span> <span class="asum-i" style="color:var(--good)">✓ ${pk(["ตามแผน","ຕາມແຜນ","on plan"])} <b class="num">${nOk}</b></span> <span class="asum-i" style="color:var(--crit)">✗ ${pk(["ต่ำกว่าเป้า","ຕ່ຳກວ່າ","below"])} <b class="num">${nLow}</b></span>${nKeep?` <span class="asum-i" style="color:var(--mut)">↔️ ${pk(["คงเดิม","ຄົງ","kept"])} <b class="num">${nKeep}</b></span>`:""}</div>`;
      return head+secBlocks;
    })()}
  </div>`;
}

renderLang(); renderNav(); overview();
if(SHEET_API) syncFromSheet();
</script>
